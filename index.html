<!doctype html><html lang="es"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>NAVE CRM</title>
<style>
  :root{
    --bg:#07080b;--bg-2:#0b0d12;--surface:#0f1219;--surface-2:#141824;--card:#141824;
    --line:#20242f;--line-2:#2a2f3c;--ink:#eef1f6;--muted:#8b93a3;--faint:#5c6472;
    --accent:#46cfe6;--accent-dim:#2b8fa1;--accent-glow:rgba(70,207,230,.16);
    --fluido:#46e0a0;--potencial:#e0b24a;--leve:#7c8698;--danger:#f0654f;--good:#46e0a0;--warn:#e0b24a;
    --mono:ui-monospace,"SF Mono",Menlo,monospace;--sans:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  }
  *{box-sizing:border-box}html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
  button{font-family:inherit;cursor:pointer}a{color:var(--accent)}
  .glow{position:fixed;top:-260px;left:50%;transform:translateX(-30%);width:900px;height:520px;background:radial-gradient(ellipse at center,var(--accent-glow),transparent 62%);pointer-events:none;z-index:0}
  .btn{border:none;border-radius:9px;padding:9px 14px;font-size:13px;font-weight:650}
  .btn.primary{background:var(--accent);color:#04121a}.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line-2)}
  .btn.danger{background:transparent;color:var(--danger);border:1px solid var(--line-2)}.btn:hover{filter:brightness(1.08)}
  .inp,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:9px;color:var(--ink);padding:9px 11px;font-size:13.5px;font-family:inherit;outline:none;width:100%}
  .inp:focus,select:focus,textarea:focus{border-color:var(--accent)}::placeholder{color:var(--faint)}
  .login{position:relative;z-index:1;min-height:100vh;display:grid;place-items:center;padding:20px}
  .login .box{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:34px;width:100%;max-width:400px}
  .login .brand{display:flex;align-items:center;gap:11px;margin-bottom:22px}
  .login h1{font-size:20px;margin:0 0 4px}.login p{color:var(--muted);font-size:13.5px;margin:0 0 20px}
  .login .field{margin-bottom:12px}.login label,.field label{font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:5px}
  .login .err{color:var(--danger);font-size:12.5px;margin-top:10px;min-height:16px}.login .alt{margin-top:14px;text-align:center;font-size:12.5px;color:var(--muted)}
  #app{display:grid;grid-template-columns:236px 1fr;min-height:100vh;position:relative;z-index:1}
  .side{background:var(--bg-2);border-right:1px solid var(--line);display:flex;flex-direction:column}
  .brand{display:flex;align-items:center;gap:10px;padding:20px 18px 16px}.brand svg{width:26px;height:26px}
  .brand .wm b{display:block;font-weight:800;font-size:15px;letter-spacing:.02em}.brand .wm span{font-family:var(--mono);font-size:9px;letter-spacing:.26em;color:var(--muted);text-transform:uppercase}
  .nav{padding:6px 10px;overflow-y:auto;flex:1}.grp{font-family:var(--mono);font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--faint);padding:14px 12px 6px}
  .nav a{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:9px;color:var(--muted);text-decoration:none;font-size:13.5px;margin-bottom:1px;cursor:pointer}
  .nav a .ic{width:16px;height:16px;opacity:.85;flex:none}.nav a:hover{background:var(--surface);color:var(--ink)}
  .nav a.on{background:linear-gradient(90deg,var(--accent-glow),transparent);color:var(--ink);box-shadow:inset 2px 0 0 var(--accent)}
  .me{border-top:1px solid var(--line);padding:12px 16px;display:flex;align-items:center;gap:10px}
  .me .av{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--accent-dim),#5a4bd6);display:grid;place-items:center;font-size:12px;font-weight:700;color:#04121a}
  .me .nm{font-size:12.5px;font-weight:600;line-height:1.2}.me .rl{font-family:var(--mono);font-size:9.5px;color:var(--faint)}.me .out{margin-left:auto;color:var(--faint);background:none;border:none;font-size:16px}
  .main{overflow-y:auto;height:100vh}
  .top{display:flex;align-items:flex-end;gap:16px;padding:26px 30px 14px;flex-wrap:wrap}
  .top h1{margin:0;font-size:27px;font-weight:800;letter-spacing:-.02em}.top .sub{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.04em;margin-bottom:5px}
  .grow{flex:1}
  .funnel{display:grid;grid-template-columns:repeat(5,1fr);gap:16px;padding:10px 30px 24px}
  @media(max-width:1180px){.funnel{grid-template-columns:repeat(3,1fr)}}@media(max-width:720px){.funnel{grid-template-columns:repeat(2,1fr)}}
  .fcell{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px 22px 20px;position:relative;overflow:hidden;min-height:132px}
  .fcell::after{content:"";position:absolute;inset:0;background:radial-gradient(120% 90% at 100% 0,var(--accent-glow),transparent 55%);opacity:.5;pointer-events:none}
  .fcell .ic2{position:absolute;right:18px;top:18px;width:18px;height:18px;color:var(--accent);opacity:.85}
  .fcell .n{font-size:34px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1}
  .fcell .l{font-family:var(--mono);font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-top:10px}
  .fcell .pct{font-family:var(--mono);font-size:11.5px;color:var(--accent);margin-top:12px}
  .fcell .track{height:4px;border-radius:3px;background:var(--surface-2);margin-top:10px;overflow:hidden}.fcell .track>i{display:block;height:100%;background:var(--accent);border-radius:3px}
  .tb{display:flex;gap:9px;align-items:center;padding:4px 30px 14px;flex-wrap:wrap}.search{min-width:230px;max-width:300px}
  .pill{background:var(--surface);border:1px solid var(--line);color:var(--muted);border-radius:20px;padding:7px 13px;font-size:12px;cursor:pointer}.pill.on{border-color:var(--accent);color:var(--ink)}
  select.pill{-webkit-appearance:none;appearance:none;width:auto}
  .tablewrap{margin:0 30px 30px;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface)}
  table{width:100%;border-collapse:collapse;font-size:13px}
  thead th{text-align:left;font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);font-weight:600;padding:12px 14px;border-bottom:1px solid var(--line);background:var(--bg-2)}
  tbody td{padding:15px 16px;border-bottom:1px solid var(--line);color:var(--muted);vertical-align:middle}tbody tr:last-child td{border-bottom:none}tbody tr.clk:hover{background:var(--surface-2);cursor:pointer}
  .nm{color:var(--ink);font-weight:600}.sub2{font-size:11.5px;color:var(--faint)}
  .chip{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;padding:3px 8px;border-radius:20px}
  .chip.fluido{color:var(--fluido);background:rgba(70,224,160,.12)}.chip.potencial{color:var(--potencial);background:rgba(224,178,74,.12)}.chip.leve{color:var(--leve);background:rgba(124,134,152,.14)}
  .chip.pendiente{color:var(--warn);background:rgba(224,178,74,.12)}.chip.cobrado{color:var(--good);background:rgba(70,224,160,.12)}.chip.vencido{color:var(--danger);background:rgba(240,101,79,.12)}
  .estado{display:inline-flex;align-items:center;gap:7px;color:var(--ink);font-size:12.5px}.dot{width:7px;height:7px;border-radius:50%;background:var(--accent)}
  .who{display:inline-flex;align-items:center;gap:7px}.who .a{width:22px;height:22px;border-radius:50%;background:#222838;display:grid;place-items:center;font-size:10px;color:var(--ink);font-weight:700}
  .foot{display:flex;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid var(--line);color:var(--faint);font-family:var(--mono);font-size:11px}
  .pg{background:var(--surface-2);border:1px solid var(--line-2);border-radius:7px;color:var(--muted);padding:5px 10px;cursor:pointer;font-family:var(--mono);font-size:11px}.pg[disabled]{opacity:.4;cursor:default}
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;z-index:60;overflow-y:auto}
  .modal{background:var(--surface);border:1px solid var(--line);border-radius:18px;width:100%;max-width:540px;padding:22px;position:relative;z-index:61}.modal h2{margin:0 0 16px;font-size:18px}
  .field{margin-bottom:13px}.row2{display:grid;grid-template-columns:1fr 1fr;gap:11px}.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:11px}@media(max-width:640px){.row2,.row3{grid-template-columns:1fr}}
  .actions{display:flex;gap:9px;margin-top:8px;align-items:center}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px;margin:0 30px 20px}
  .card h3{margin:0 0 4px;font-size:16px}.card .cdesc{color:var(--muted);font-size:13px;margin:0 0 16px}
  .sechead{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin:6px 0 12px}
  .tabs{display:flex;gap:6px;padding:0 30px 14px}.tab{background:var(--surface);border:1px solid var(--line);color:var(--muted);border-radius:9px;padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer}.tab.on{background:var(--surface-2);color:var(--ink);border-color:var(--accent)}
  .attend{display:flex;gap:8px}.clbtn{flex:1;padding:9px;border-radius:9px;border:1px solid var(--line-2);background:var(--surface);color:var(--muted);font-size:12.5px;cursor:pointer}.clbtn.yes{background:rgba(70,207,230,.15);border-color:var(--accent-dim);color:var(--accent)}
  .bars{display:flex;align-items:flex-end;gap:18px;height:180px;padding:16px 6px 0}.bar{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;justify-content:flex-end;height:100%}
  .bar .col{width:60%;max-width:64px;background:linear-gradient(180deg,var(--accent),var(--accent-dim));border-radius:8px 8px 0 0;min-height:3px}.bar .bl{font-size:12px;color:var(--muted)}.bar .bn{font-family:var(--mono);font-size:12px;color:var(--ink)}
  .agenda .day{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin:16px 0 8px}
  .ev{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:12px 14px;margin-bottom:8px}
  .ev .tg{font-family:var(--mono);font-size:10px;color:var(--faint);text-transform:uppercase;border:1px solid var(--line-2);border-radius:6px;padding:2px 7px}
  .stub{margin:40px 30px;padding:50px 30px;border:1px dashed var(--line-2);border-radius:16px;text-align:center;color:var(--faint)}.stub b{color:var(--ink);display:block;font-size:16px;margin-bottom:6px}
  .empty{padding:44px;text-align:center;color:var(--faint);font-size:14px}
  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--surface-2);border:1px solid var(--line-2);color:var(--ink);padding:11px 18px;border-radius:11px;font-size:13px;z-index:90;opacity:0;transition:opacity .2s}.toast.show{opacity:1}
  .mapgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;align-items:center;margin:6px 0 14px}.mapgrid .csvcol{font-size:13px;color:var(--ink);font-family:var(--mono)}
  .split{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin:0 30px 20px}@media(max-width:900px){.split{grid-template-columns:1fr}}
  .listrow{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}.listrow:last-child{border:none}
</style></head>
<body>
<div class="glow"></div><div id="root"></div><div id="toast" class="toast"></div>
<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2'
/* ===== CONFIG — completá antes de deployar (Supabase → Settings → API) ===== */
const SUPABASE_URL = 'https://mnsbmrzeltolhkzdbaop.supabase.co'
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1uc2JtcnplbHRvbGhremRiYW9wIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU5NTEyODcsImV4cCI6MjEwMTUyNzI4N30.Zb0JD1dx2xiqmc_-mvtOU6dYhtjV8MYq7tbLg8r1Wgg'

const ROCKET=`<svg viewBox="0 0 48 48" fill="none"><g fill="currentColor"><path d="M20.4 8.6 L32.6 20.4 Q27.4 20 25.7 22.2 Q24.4 23.9 24 26.6 Q23.1 22.6 20.4 21.4 Q17.7 20.2 14 20.8 Z"/><path d="M24 26.4 C31.6 33.4 29.4 42.2 14.6 43.4 C23.8 40 25.2 31.6 21.8 27.6 Z"/></g></svg>`
const ESTADOS=['Nuevo','Contactado','Confirmó clase','Asistió','Agendó','Cerrado','Perdido']
const TEMPS=['fluido','potencial','leve'];const MONEDAS=['USD','ARS','EUR'];const FORMAS=['Un pago','2 cuotas','3 cuotas'];const PAGE=50
const root=document.getElementById('root')
let sb=null,me=null,myProfile=null
let state={page:0,q:'',temp:'',estado:'',mine:false,total:0,leads:[],setters:[],lanz:null,clases:[]}
const esc=s=>(s??'').toString().replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))
const initials=n=>(n||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase()
const isMgr=()=>myProfile&&(myProfile.rol==='manager'||myProfile.rol==='admin')
const money=n=>'US$ '+(Number(n||0)).toLocaleString('es',{minimumFractionDigits:2,maximumFractionDigits:2})
const fmtCur=(n,mon)=>(mon||'USD')+' '+(Number(n||0)).toLocaleString('es',{minimumFractionDigits:2,maximumFractionDigits:2})
const num=n=>(Number(n||0)).toLocaleString('es')
const nameOf=id=>{const s=state.setters.find(x=>x.id===id);return s?s.nombre:null}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1900)}
function fmtDate(s){if(!s)return'—';const d=new Date(s),n=new Date();if(d.toDateString()===n.toDateString())return'hoy '+d.toLocaleTimeString('es',{hour:'2-digit',minute:'2-digit'});return d.toLocaleDateString('es',{day:'2-digit',month:'2-digit'})}
function view(){return document.getElementById('view')}

/* ---------- BOOT ---------- */
function renderError(e){root.innerHTML=`<div class="login"><div class="box"><div class="brand">${ROCKET}<div class="wm"><b>NAVE</b><span>Instituto · CRM</span></div></div><h1>Ups, algo falló al cargar</h1><p>${esc((e&&e.message)||e||'Error desconocido')}</p><button class="btn primary" style="width:100%" onclick="location.reload()">Reintentar</button><div class="alt"><a onclick="(async()=>{await sb.auth.signOut();location.reload()})()">Cerrar sesión y volver a entrar</a></div></div></div>`}
window.addEventListener('error',ev=>console.error('window error',ev.error||ev.message))
function renderConfigNeeded(){root.innerHTML=`<div class="login"><div class="box"><div class="brand">${ROCKET}<div class="wm"><b>NAVE</b><span>Instituto · CRM</span></div></div><h1>Falta conectar Supabase</h1><p>Completá <code>SUPABASE_URL</code> y <code>SUPABASE_ANON_KEY</code> arriba de <code>index.html</code> (Supabase → Settings → API) y volvé a deployar. El SQL está en <code>schema.sql</code>.</p></div></div>`}

/* ---------- AUTH ---------- */
function renderLogin(){
  root.innerHTML=`<div class="login"><div class="box"><div class="brand">${ROCKET}<div class="wm"><b>NAVE</b><span>Instituto · CRM</span></div></div>
    <h1 id="lt">Ingresá</h1><p id="ls">Accedé con tu cuenta del equipo.</p>
    <div class="field"><label>Email</label><input class="inp" id="le" type="email" placeholder="vos@nave.com"/></div>
    <div class="field"><label>Contraseña</label><input class="inp" id="lp" type="password" placeholder="••••••••"/></div>
    <div class="field" id="lnw" style="display:none"><label>Tu nombre</label><input class="inp" id="ln" placeholder="Nombre y apellido"/></div>
    <button class="btn primary" id="lb" style="width:100%;margin-top:6px">Entrar</button><div class="err" id="lerr"></div>
    <div class="alt">¿No tenés cuenta? <a id="ltg">Crear una</a></div></div></div>`
  let m='in';const $=id=>document.getElementById(id)
  $('ltg').onclick=()=>{m=m==='in'?'up':'in';$('lt').textContent=m==='in'?'Ingresá':'Crear cuenta';$('lnw').style.display=m==='in'?'none':'block';$('lb').textContent=m==='in'?'Entrar':'Crear cuenta';$('ltg').textContent=m==='in'?'Crear una':'Ya tengo cuenta'}
  $('lb').onclick=async()=>{const email=$('le').value.trim(),pass=$('lp').value,err=$('lerr');err.textContent=''
    if(!email||!pass){err.textContent='Completá email y contraseña.';return}$('lb').textContent='...'
    let r=m==='up'?await sb.auth.signUp({email,password:pass,options:{data:{nombre:$('ln').value.trim()}}}):await sb.auth.signInWithPassword({email,password:pass})
    if(r.error){err.textContent=r.error.message;$('lb').textContent=m==='in'?'Entrar':'Crear cuenta';return}
    if(r.data.session)await afterLogin(r.data.session);else err.textContent='Revisá tu email para confirmar la cuenta.'}
}
async function afterLogin(session){me=session.user
  try{const{data:prof}=await sb.from('profiles').select('*').eq('id',me.id).maybeSingle();if(prof)myProfile=prof}catch(e){console.error('profile',e)}
  if(!myProfile)myProfile={nombre:(me.email||'Usuario'),rol:'setter'}
  try{await ensureLanzamiento()}catch(e){console.error('lanz',e)}
  try{await ensureClases()}catch(e){console.error('clases',e)}
  try{const{data:setters}=await sb.from('profiles').select('id,nombre,rol,com_setter_pct,com_closer_pct').eq('activo',true);state.setters=setters||[]}catch(e){console.error('setters',e)}
  if(!location.hash||location.hash==='#')location.hash='#/panel'
  renderShell();route()}
async function ensureLanzamiento(){let{data}=await sb.from('lanzamientos').select('*').eq('activo',true).order('created_at',{ascending:false}).limit(1)
  if(data&&data[0]){state.lanz=data[0];return}
  if(isMgr()){const{data:n}=await sb.from('lanzamientos').insert({nombre:'Lanzamiento actual',activo:true}).select().single();state.lanz=n}}
async function ensureClases(){if(!state.lanz)return
  let{data}=await sb.from('clases').select('*').eq('lanzamiento_id',state.lanz.id).order('numero')
  if((!data||!data.length)&&isMgr()){await sb.from('clases').insert([1,2,3].map(nu=>({lanzamiento_id:state.lanz.id,numero:nu,titulo:'Clase '+nu})));const r=await sb.from('clases').select('*').eq('lanzamiento_id',state.lanz.id).order('numero');data=r.data}
  state.clases=data||[]}

/* ---------- SHELL + ROUTER ---------- */
const NAV=[
  {g:null,items:[['#/panel','Panel general'],['#/calendario','Calendario']]},
  {g:'Setter',items:[['#/leads','Leads'],['#/nuevo','Nuevo lead'],['#/importar','Importar / agendar'],['#/kpis','KPIs diarios']]},
  {g:'Closer',items:[['#/triage','Triage'],['#/reporte','Reporte de llamadas'],['#/grilla','Grilla de reportes']]},
  {g:'Ventas',items:[['#/ventas','Ventas'],['#/senas','Señas']]},
  {g:'Marketing',items:[['#/marketing','Rendimiento de contenido']]},
  {g:'Cobros',items:[['#/cobros','Cuotas y seguimientos'],['#/facturacion','Facturación'],['#/comisiones','Comisiones']]}]
function renderShell(){
  const nav=NAV.map(s=>`${s.g?`<div class="grp">${s.g}</div>`:''}${s.items.map(([h,l])=>`<a data-h="${h}"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="9"/></svg><span>${l}</span></a>`).join('')}`).join('')
  root.innerHTML=`<div id="app"><aside class="side"><div class="brand">${ROCKET}<div class="wm"><b>NAVE</b><span>Instituto · CRM</span></div></div>
    <nav class="nav">${nav}</nav>
    <div class="me"><div class="av">${initials(myProfile.nombre)}</div><div><div class="nm">${esc(myProfile.nombre||me.email)}</div><div class="rl">${esc(myProfile.rol)}</div></div><button class="out" id="so" title="Salir">⎋</button></div>
    </aside><main class="main" id="view"></main></div>`
  root.querySelectorAll('.nav a').forEach(a=>a.onclick=()=>location.hash=a.dataset.h)
  document.getElementById('so').onclick=()=>sb.auth.signOut();window.onhashchange=route}
function setActive(){root.querySelectorAll('.nav a').forEach(a=>a.classList.toggle('on',a.dataset.h===location.hash))}
function route(){setActive();const h=location.hash
  const map={'#/panel':renderPanel,'#/calendario':renderCalendario,'#/leads':renderLeads,'#/nuevo':()=>openLeadModal(),'#/importar':renderImport,'#/kpis':renderKpis,'#/triage':renderTriage,'#/reporte':renderReporte,'#/grilla':renderGrilla,'#/ventas':renderVentas,'#/senas':renderSenas,'#/comisiones':renderComisiones,'#/facturacion':renderFacturacion,'#/marketing':renderMarketing,'#/cobros':renderCobros}
  ;(map[h]||renderPanel)()}
function head(sub,title,actions=''){return `<div class="top"><div><div class="sub">${sub}</div><h1>${title}</h1></div><div class="grow"></div>${actions}</div>`}

/* ================= PANEL GENERAL ================= */
async function renderPanel(){
  view().innerHTML=head('DASHBOARD · '+esc((state.lanz&&state.lanz.nombre)||'LANZAMIENTO'),'Panel general')+`<div class="funnel" id="funnel"></div>
    <div class="split"><div class="card" style="margin:0"><h3>Seguimientos de hoy</h3><p class="cdesc">Tu cola priorizada del día.</p><div id="seg"></div></div>
    <div class="card" style="margin:0"><h3>Cobros del lanzamiento</h3><p class="cdesc">Resumen de plata.</p><div id="cob"></div></div></div>`
  loadFunnel()
  // seguimientos hoy
  const today=new Date().toISOString().slice(0,10)
  let sq=sb.from('seguimientos').select('*,leads(nombre,contacto)').eq('hecho',false).lte('fecha_programada',today).order('fecha_programada').limit(30)
  if(!isMgr())sq=sq.eq('asesor_id',me.id)
  const{data:segs}=await sq
  document.getElementById('seg').innerHTML=(segs&&segs.length)?segs.map(s=>`<div class="listrow"><div style="flex:1"><div class="nm">${esc(s.leads?s.leads.nombre:'Lead')}</div><div class="sub2">${esc(s.tipo||'seguimiento')} · ${esc(s.nota||'')}</div></div><div class="sub2">${esc(s.fecha_programada||'')}</div><button class="pg" data-seg="${s.id}">✓ hecho</button></div>`).join(''):`<div class="empty" style="padding:24px">Sin seguimientos pendientes 🎉</div>`
  document.querySelectorAll('[data-seg]').forEach(b=>b.onclick=async()=>{await sb.from('seguimientos').update({hecho:true}).eq('id',b.dataset.seg);toast('Marcado ✓');renderPanel()})
  // cobros resumen
  const c=await cobrosResumen()
  document.getElementById('cob').innerHTML=`<div class="listrow"><span style="flex:1" class="sub2">Cobrado total</span><span class="nm">${money(c.cobrado)}</span></div>
    <div class="listrow"><span style="flex:1" class="sub2">↳ de eso, señas activadas</span><span class="nm">${money(c.senas)}</span></div>
    <div class="listrow"><span style="flex:1" class="sub2">Al día (pendiente)</span><span class="nm">${money(c.aldia)}</span></div>
    <div class="listrow"><span style="flex:1" class="sub2">Vencidas</span><span class="nm" style="color:var(--danger)">${money(c.vencidas)}</span></div>
    <div class="listrow"><span style="flex:1" class="sub2">Total programa activo</span><span class="nm">${money(c.total)}</span></div>`
}
async function loadFunnel(){const el=document.getElementById('funnel');if(!el)return
  const{count:total}=await sb.from('leads').select('*',{count:'exact',head:true})
  const ci=async es=>{const{count}=await sb.from('leads').select('*',{count:'exact',head:true}).in('estado',es);return count||0}
  const conf=await ci(['Confirmó clase','Asistió','Agendó','Cerrado']),asis=await ci(['Asistió','Agendó','Cerrado']),agen=await ci(['Agendó','Cerrado']),cerr=await ci(['Cerrado'])
  const t=total||0,pc=n=>t?((n/t*100).toFixed(1).replace('.',',')+'%'):'0%',w=n=>t?Math.round(n/t*100):0
  const cells=[['Leads totales',t,'100%',100],['Confirmaron clase',conf,pc(conf),w(conf)],['Asistieron',asis,pc(asis),w(asis)],['Agendaron call',agen,pc(agen),w(agen)],['Cerraron',cerr,pc(cerr),w(cerr)]]
  el.innerHTML=cells.map(([l,n,p,wd])=>`<div class="fcell"><svg class="ic2" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="9"/></svg><div class="n">${num(n)}</div><div class="l">${l}</div><div class="pct">${p}</div><div class="track"><i style="width:${wd}%"></i></div></div>`).join('')}
async function cobrosResumen(){const today=new Date().toISOString().slice(0,10)
  const{data}=await sb.from('cuotas').select('monto_usd,estado,vencimiento,origen,venta_id').limit(10000)
  let cobrado=0,aldia=0,vencidas=0,total=0,upsell=0;const ventasConCobro=new Set()
  ;(data||[]).forEach(c=>{const m=Number(c.monto_usd||0);total+=m
    if(c.estado==='cobrado'){cobrado+=m;if(c.venta_id)ventasConCobro.add(c.venta_id);if(['upsell','resell'].includes(c.origen))upsell+=m}
    else if(c.estado==='vencido'||(c.vencimiento&&c.vencimiento<today))vencidas+=m;else aldia+=m})
  // señas: suman al cash collected sólo si su venta ya cobró al menos una cuota
  let senas=0
  const{data:sn}=await sb.from('senas').select('monto_usd,venta_id,estado').eq('estado','aplicada').limit(10000)
  ;(sn||[]).forEach(s=>{if(s.venta_id&&ventasConCobro.has(s.venta_id))senas+=Number(s.monto_usd||0)})
  cobrado+=senas
  return{cobrado,aldia,vencidas,total,upsell,senas}}

function baseQuery(count){let q=sb.from('leads').select('*',count?{count:'exact'}:{})
  if(state.mine)q=q.eq('asesor_id',me.id);if(state.temp)q=q.eq('temperatura',state.temp);if(state.estado)q=q.eq('estado',state.estado)
  if(state.q)q=q.or(`nombre.ilike.%${state.q}%,contacto.ilike.%${state.q}%`);return q}
async function loadLeads(){const rows=document.getElementById('rows');if(!rows)return
  const from=state.page*PAGE
  const{data,count,error}=await baseQuery(true).order('updated_at',{ascending:false}).range(from,from+PAGE-1)
  if(error){rows.innerHTML=`<tr><td colspan="6" class="empty">Error: ${esc(error.message)}</td></tr>`;return}
  state.leads=data||[];state.total=count||0
  rows.innerHTML=state.leads.length?state.leads.map(l=>`<tr class="clk" data-id="${l.id}"><td><div class="nm">${esc(l.nombre)||'(sin nombre)'}</div><div class="sub2">${esc(l.fuente||'')}</div></td><td>${esc(l.contacto||'—')}</td><td><span class="chip ${l.temperatura||'potencial'}">${esc(l.temperatura||'potencial')}</span></td><td><span class="estado"><span class="dot"></span>${esc(l.estado||'Nuevo')}</span></td><td>${l.asesor_id?`<span class="who"><span class="a">${initials(nameOf(l.asesor_id))}</span>${esc((nameOf(l.asesor_id)||'').split(' ')[0])}</span>`:'<span class="sub2">— sin asignar</span>'}</td><td class="sub2">${fmtDate(l.updated_at)}</td></tr>`).join(''):`<tr><td colspan="6" class="empty">No hay leads con estos filtros.</td></tr>`
  rows.querySelectorAll('tr[data-id]').forEach(tr=>tr.onclick=()=>openLeadModal(state.leads.find(x=>x.id===tr.dataset.id)))
  const pages=Math.max(1,Math.ceil(state.total/PAGE)),f=document.getElementById('foot')
  f.innerHTML=`<span>Mostrando ${state.total?from+1:0}–${Math.min(from+PAGE,state.total)} de ${num(state.total)}</span><div class="grow"></div><button class="pg" id="prev" ${state.page<=0?'disabled':''}>‹ Anterior</button><span>${state.page+1}/${pages}</span><button class="pg" id="next" ${state.page>=pages-1?'disabled':''}>Siguiente ›</button>`
  const pv=document.getElementById('prev'),nx=document.getElementById('next')
  if(pv)pv.onclick=()=>{if(state.page>0){state.page--;loadLeads()}};if(nx)nx.onclick=()=>{if(state.page<pages-1){state.page++;loadLeads()}}}

  const l=lead||{nombre:'',contacto:'',fuente:'Instagram',temperatura:'potencial',estado:'Nuevo',tema:'',dolor:'',notas:'',asesor_id:me.id}

    <div class="row2"><div class="field"><label>Nombre *</label><input class="inp" id="m_nombre" value="${esc(l.nombre)}"/></div><div class="field"><label>Contacto (@ / WhatsApp)</label><input class="inp" id="m_contacto" value="${esc(l.contacto)}"/></div></div>

    <div class="field"><label>Tema que eligió</label><input class="inp" id="m_tema" value="${esc(l.tema)}"/></div>
    ${state.clases.length?`<div class="field"><label>Asistencia a clases</label><div class="attend" id="m_asist">${state.clases.map(c=>`<button type="button" class="clbtn ${asist[c.id]?'yes':''}" data-cl="${c.id}">Clase ${c.numero}</button>`).join('')}</div></div>`:''}
    <div class="row2"><div class="field"><label>Próximo seguimiento</label><input class="inp" id="m_segf" type="date"/></div><div class="field"><label>Nota del seguimiento</label><input class="inp" id="m_segn" placeholder="ej: mandar audio FOMO"/></div></div>
    <div class="field"><label>Notas</label><textarea id="m_notas" rows="2">${esc(l.notas)}</textarea></div>
    <div class="actions">${lead?'<button class="btn danger" id="m_del">Eliminar</button>':''}<div class="grow"></div><button class="btn ghost" id="m_cancel">Cancelar</button><button class="btn primary" id="m_save">Guardar</button></div></div>`
  document.body.appendChild(ov);const g=id=>ov.querySelector('#'+id)
  ov.onclick=e=>{if(e.target===ov)ov.remove()};g('m_cancel').onclick=()=>ov.remove()
  ov.querySelectorAll('[data-cl]').forEach(b=>b.onclick=()=>b.classList.toggle('yes'))
  g('m_save').onclick=async()=>{const p={nombre:g('m_nombre').value.trim(),contacto:g('m_contacto').value.trim(),temperatura:g('m_temp').value,estado:g('m_estado').value,fuente:g('m_fuente').value.trim(),asesor_id:g('m_asesor').value||null,tema:g('m_tema').value.trim(),notas:g('m_notas').value.trim(),lanzamiento_id:state.lanz?state.lanz.id:null,updated_at:new Date().toISOString()}
    if(!p.nombre){toast('Poné un nombre');return};if(p.contacto)p.dedup_key=p.contacto.toLowerCase().replace(/[^a-z0-9]/g,'')
    let leadId=lead?lead.id:null,res=lead?await sb.from('leads').update(p).eq('id',lead.id):await sb.from('leads').insert(p).select().single()

function renderImport(){view().innerHTML=head('SETTER','Importar leads (CSV)')+`<div class="card"><p class="cdesc">Subí un CSV (primera fila = encabezado). Mapeás las columnas, se descartan duplicados por contacto y ${isMgr()?'se reparten entre asesores activos':'quedan a tu nombre'}.</p><input type="file" id="csv" accept=".csv,text/csv" class="inp" style="padding:14px"/><div id="mapArea"></div></div>`
  document.getElementById('csv').onchange=handleCsv}
function parseCsv(text){const rows=[];let i=0,cur='',row=[],q=false;const push=()=>{row.push(cur);cur=''},pushR=()=>{push();rows.push(row);row=[]}
  while(i<text.length){const c=text[i];if(q){if(c==='"'){if(text[i+1]==='"'){cur+='"';i++}else q=false}else cur+=c}else{if(c==='"')q=true;else if(c===',')push();else if(c==='\n')pushR();else if(c==='\r'){}else cur+=c}i++}
  if(cur.length||row.length)pushR();return rows.filter(r=>r.some(x=>x.trim()!==''))}
let CSV=null
function handleCsv(e){const f=e.target.files[0];if(!f)return;const rd=new FileReader()
  rd.onload=()=>{const rows=parseCsv(rd.result);if(rows.length<2){toast('CSV vacío o sin datos');return};CSV={headers:rows[0],rows:rows.slice(1)}
    const gs=(...k)=>CSV.headers.findIndex(h=>k.some(x=>h.toLowerCase().includes(x)))
    const fs=[['nombre','Nombre',gs('nombre','name')],['contacto','Contacto (@ / WhatsApp)',gs('contacto','instagram','whats','usuario','telefono','phone')],['fuente','Fuente',gs('fuente','source','plataforma')],['temperatura','Temperatura',gs('temperatura','temp')]]
    document.getElementById('mapArea').innerHTML=`<div style="margin-top:18px"><b style="font-size:13px">Mapeá las columnas · ${CSV.rows.length} filas</b><div class="mapgrid" style="margin-top:12px">${fs.map(([k,lab,gi])=>`<span class="csvcol">${lab}</span><select id="map_${k}"><option value="-1">— ninguna —</option>${CSV.headers.map((h,idx)=>`<option value="${idx}" ${idx===gi?'selected':''}>${esc(h)}</option>`).join('')}</select>`).join('')}</div><button class="btn primary" id="doImp">Importar ${CSV.rows.length} leads</button></div>`
    document.getElementById('doImp').onclick=doImport}
  rd.readAsText(f)}
async function doImport(){const gm=k=>parseInt(document.getElementById('map_'+k).value),mi={nombre:gm('nombre'),contacto:gm('contacto'),fuente:gm('fuente'),temperatura:gm('temperatura')}
  if(mi.nombre<0){toast('Elegí la columna de Nombre');return}
  const setters=isMgr()?state.setters:[{id:me.id}],btn=document.getElementById('doImp');btn.textContent='Importando…'
  const rows=CSV.rows.map((r,idx)=>{const contacto=mi.contacto>=0?(r[mi.contacto]||'').trim():'',temp=mi.temperatura>=0?(r[mi.temperatura]||'').trim().toLowerCase():''
    return{nombre:(r[mi.nombre]||'').trim(),contacto,fuente:mi.fuente>=0?(r[mi.fuente]||'').trim():null,temperatura:TEMPS.includes(temp)?temp:'potencial',estado:'Nuevo',asesor_id:setters.length?setters[idx%setters.length].id:null,lanzamiento_id:state.lanz?state.lanz.id:null,dedup_key:contacto?contacto.toLowerCase().replace(/[^a-z0-9]/g,''):null}}).filter(r=>r.nombre)
  let ok=0;for(let i=0;i<rows.length;i+=500){const chunk=rows.slice(i,i+500);const{error,count}=await sb.from('leads').upsert(chunk,{onConflict:'lanzamiento_id,dedup_key',ignoreDuplicates:true,count:'exact'});if(error){toast('Error: '+error.message);btn.textContent='Reintentar';return}ok+=count||chunk.length}
  toast(`Importados ${ok} leads ✓`);location.hash='#/leads'}
async function autoRepartir(){if(!confirm('¿Repartir los leads SIN asignar entre los asesores activos?'))return
  const{data:un}=await sb.from('leads').select('id').is('asesor_id',null).limit(5000);if(!un||!un.length){toast('No hay leads sin asignar');return}
  const st=state.setters;if(!st.length){toast('No hay asesores activos');return}
  for(let i=0;i<un.length;i++)await sb.from('leads').update({asesor_id:st[i%st.length].id}).eq('id',un[i].id)
  toast(`Repartidos ${un.length} leads ✓`);loadLeads();loadFunnel()}

// Comportamiento dinámico: recalcula "a cobrar" y muestra los renglones de cuotas pendientes
function wireVentaForm(p){const g=id=>document.getElementById(p+id)
  function build(){const ticket=Number(g('ticket').value||0),pago=Number(g('pago').value||0),forma=g('forma').value
    const n=forma==='2 cuotas'?1:forma==='3 cuotas'?2:0,resto=Math.max(0,ticket-pago)
    if(document.activeElement!==g('cobrar'))g('cobrar').value=resto?Number(resto.toFixed(2)):''
    const box=g('cuotasBox'),cur=box.querySelectorAll('[data-cuota]').length
    if(n===0){box.innerHTML='';return}
    if(cur!==n){const each=n?resto/n:0;let rows=''
      for(let i=1;i<=n;i++)rows+=`<div class="row2" data-cuota="${i}"><div class="field"><label>Cuota ${i+1} — monto</label><input class="inp cuotaMonto" type="number" value="${each?Number(each.toFixed(2)):''}"/></div><div class="field"><label>Vencimiento cuota ${i+1}</label><input class="inp cuotaVenc" type="date"/></div></div>`
      box.innerHTML=`<div class="sechead">Cuotas pendientes (a cobrar)</div>${rows}`
      box.querySelectorAll('.cuotaVenc').forEach((el,idx)=>{const d=new Date();d.setMonth(d.getMonth()+idx+1);el.value=d.toISOString().slice(0,10)})}}
  g('ticket').oninput=build;g('pago').oninput=build;g('forma').onchange=build;build()
  const monEl=g('mon'),fxWrap=g('fxWrap'),fxEl=g('fx'),fxLbl=g('fxLbl')
  async function onMon(){const m=monEl.value
    if(m==='USD'){if(fxWrap)fxWrap.style.display='none';if(fxEl)fxEl.value=''}
    else if(fxWrap){fxWrap.style.display='';if(fxLbl)fxLbl.textContent='Cotización (1 USD = ? '+m+')';if(fxEl&&!fxEl.value){const r=await fxRate(m);if(r&&r!==1)fxEl.value=r}}}
  if(monEl)monEl.onchange=onMon;onMon()}

// Sube el comprobante a Supabase Storage (bucket 'comprobantes') y devuelve la URL pública
async function uploadComprobante(file){if(!file)return null
  const ext=(file.name.split('.').pop()||'bin').toLowerCase(),rnd=Math.random().toString(36).slice(2,8)
  const path=`${(state.lanz&&state.lanz.id)||'na'}/${Date.now()}-${rnd}.${ext}`
  const{error}=await sb.storage.from('comprobantes').upload(path,file,{upsert:false,contentType:file.type||undefined})
  if(error)throw error

async function saveVenta(v){const rate=v.moneda==='USD'?1:(Number(v.fx)>0?Number(v.fx):await fxRate(v.moneda))
  let comprobante_url=v.currentComprobante||null

    await sb.from('cuotas').delete().eq('venta_id',v.editId)
    await sb.from('senas').update({estado:'registrada',venta_id:null}).eq('venta_id',v.editId)
    const{error}=await sb.from('ventas').update(venta).eq('id',v.editId);if(error)throw error
  }else{const{data:vrow,error}=await sb.from('ventas').insert(venta).select().single();if(error)throw error;ventaId=vrow.id}
  const cuotas=[]
  if(v.pago>0)cuotas.push({venta_id:ventaId,lead_id:v.leadId||null,programa:v.programa,moneda:v.moneda,monto:v.pago,monto_usd:v.pago/(rate||1),estado:'cobrado',origen,billetera:v.billetera,comprobante_url,cobrado_at:new Date().toISOString(),vencimiento:new Date().toISOString().slice(0,10)})
  ;(v.cuotas||[]).forEach(c=>cuotas.push({venta_id:ventaId,lead_id:v.leadId||null,programa:v.programa,moneda:v.moneda,monto:c.monto,monto_usd:c.monto/(rate||1),estado:'pendiente',origen,billetera:v.billetera,vencimiento:c.vencimiento}))
  if(cuotas.length){const{error:ce}=await sb.from('cuotas').insert(cuotas);if(ce)throw ce}

  return{id:ventaId}}

async function renderFacturacion(){
  const{data:lanzs}=await sb.from('lanzamientos').select('id,numero,nombre').order('numero',{ascending:true,nullsFirst:false})
  if(facLanzFilter===null)facLanzFilter=(state.lanz&&state.lanz.id)||'all'
  const opts=`<option value="all">Todos los lanzamientos</option>`+(lanzs||[]).map(l=>`<option value="${l.id}" ${facLanzFilter===l.id?'selected':''}>${lanzLabel(l)}</option>`).join('')
  view().innerHTML=head('FACTURACIÓN','Facturación y cash collected',`<select class="pill" id="fc_lanz">${opts}</select>`)+`<div class="funnel" id="fk"></div><div id="facBody"><div class="empty" style="padding:24px">Cargando…</div></div>`
  document.getElementById('fc_lanz').onchange=e=>{facLanzFilter=e.target.value;renderFacturacion()}
  let vq=sb.from('ventas').select('id,moneda,ticket,cotizacion');if(facLanzFilter!=='all')vq=vq.eq('lanzamiento_id',facLanzFilter)
  const{data:ventas,error}=await vq
  if(error){document.getElementById('facBody').innerHTML=`<div class="empty" style="padding:24px">Error: ${esc(error.message)}</div>`;return}
  let cq=sb.from('cuotas').select('monto,monto_usd,estado,moneda,billetera,venta_id,ventas!inner(lanzamiento_id)');if(facLanzFilter!=='all')cq=cq.eq('ventas.lanzamiento_id',facLanzFilter)
  const{data:cuotas}=await cq
  let sq=sb.from('senas').select('monto,monto_usd,moneda,billetera,venta_id,ventas!inner(lanzamiento_id)').eq('estado','aplicada');if(facLanzFilter!=='all')sq=sq.eq('ventas.lanzamiento_id',facLanzFilter)
  const{data:senas}=await sq
  // acumular por moneda
  const M={} // moneda -> {fact,factUsd,cash,cashUsd,pend,pendUsd}
  const slot=m=>M[m]=M[m]||{fact:0,factUsd:0,cash:0,cashUsd:0,pend:0,pendUsd:0}
  const W={} // billetera -> cash USD
  const addW=(b,u)=>{const k=(b&&b.trim())||'(sin especificar)';W[k]=(W[k]||0)+Number(u||0)}
  ;(ventas||[]).forEach(v=>{const m=v.moneda||'USD',a=slot(m);a.fact+=Number(v.ticket||0);a.factUsd+=Number(v.ticket||0)/(Number(v.cotizacion)||1)})
  const ventasConCobro=new Set()
  ;(cuotas||[]).forEach(c=>{const m=c.moneda||'USD',a=slot(m)
    if(c.estado==='cobrado'){if(c.venta_id)ventasConCobro.add(c.venta_id);a.cash+=Number(c.monto||0);a.cashUsd+=Number(c.monto_usd||0);addW(c.billetera,c.monto_usd)}
    else{a.pend+=Number(c.monto||0);a.pendUsd+=Number(c.monto_usd||0)}})
  ;(senas||[]).forEach(s=>{if(!s.venta_id||!ventasConCobro.has(s.venta_id))return;const m=s.moneda||'USD',a=slot(m);a.cash+=Number(s.monto||0);a.cashUsd+=Number(s.monto_usd||0);addW(s.billetera,s.monto_usd)})
  // totales unificados USD
  const T=Object.values(M).reduce((t,a)=>({factUsd:t.factUsd+a.factUsd,cashUsd:t.cashUsd+a.cashUsd,pendUsd:t.pendUsd+a.pendUsd}),{factUsd:0,cashUsd:0,pendUsd:0})
  document.getElementById('fk').innerHTML=[['Facturación (USD)',money(T.factUsd)],['Cash collected (USD)',money(T.cashUsd)],['Por cobrar (USD)',money(T.pendUsd)]].map(([l,n])=>`<div class="fcell"><div class="n" style="font-size:24px">${n}</div><div class="l">${l}</div></div>`).join('')
  const rowsCur=(mon,a)=>`<div class="card" style="margin:0 30px 16px"><h3>Ventas en ${mon}</h3>
    <div class="listrow"><span style="flex:1" class="sub2">Facturación (ticket total)</span><span class="nm">${fmtCur(a.fact,mon)}</span></div>
    <div class="listrow"><span style="flex:1" class="sub2">Cash collected</span><span class="nm">${fmtCur(a.cash,mon)}</span></div>
    <div class="listrow"><span style="flex:1" class="sub2">Por cobrar</span><span class="nm">${fmtCur(a.pend,mon)}</span></div></div>`
  const orden=['ARS','USD','EUR'].filter(m=>M[m]).concat(Object.keys(M).filter(m=>!['ARS','USD','EUR'].includes(m)))
  const cards=orden.length?orden.map(m=>rowsCur(m,M[m])).join(''):`<div class="empty" style="padding:24px">Sin ventas cargadas todavía.</div>`
  const total=`<div class="card" style="margin:0 30px 24px;border-color:var(--accent-dim)"><h3>Total unificado (USD)</h3><p class="cdesc">Las ventas en otras monedas se convierten a USD con la cotización de cada venta.</p>
    <div class="listrow"><span style="flex:1" class="sub2">Facturación</span><span class="nm">${money(T.factUsd)}</span></div>
    <div class="listrow"><span style="flex:1" class="sub2">Cash collected</span><span class="nm">${money(T.cashUsd)}</span></div>
    <div class="listrow"><span style="flex:1" class="sub2">Por cobrar</span><span class="nm">${money(T.pendUsd)}</span></div></div>`
  const wl=Object.keys(W).sort((a,b)=>W[b]-W[a])
  const wallets=`<div class="card" style="margin:0 30px 24px"><h3>Cash por billetera</h3><p class="cdesc">Cash collected por medio de cobro (incluye señas activadas), en USD.</p>${wl.length?wl.map(w=>`<div class="listrow"><span style="flex:1" class="sub2">${esc(w)}</span><span class="nm">${money(W[w])}</span></div>`).join(''):'<div class="empty" style="padding:12px">Sin cobros todavía.</div>'}</div>`
  document.getElementById('facBody').innerHTML=cards+total+wallets}

/* ================= COMISIONES ================= */
let comLanzFilter=null,COM_LINES=[],COM_PAID=new Set(),facLanzFilter=null
const lanzLabel=l=>(l.numero!=null?('N° '+l.numero+' · '):'')+esc(l.nombre||'Lanzamiento')
async function renderComisiones(){
  const{data:lanzs}=await sb.from('lanzamientos').select('id,numero,nombre').order('numero',{ascending:true,nullsFirst:false})
  if(comLanzFilter===null)comLanzFilter=(state.lanz&&state.lanz.id)||'all'
  const opts=`<option value="all">Todos los lanzamientos</option>`+(lanzs||[]).map(l=>`<option value="${l.id}" ${comLanzFilter===l.id?'selected':''}>${lanzLabel(l)}</option>`).join('')
  const actions=`<select class="pill" id="cm_lanz" style="margin-right:8px">${opts}</select>${isMgr()?'<button class="btn ghost" id="cm_lanzmgr">Lanzamientos</button>':''}`
  view().innerHTML=head('COMISIONES','Comisiones',actions)+`<div id="cfgWrap"></div><div class="funnel" id="ck"></div>
    <div class="split">
      <div class="card" style="margin:0"><h3>Setters</h3><p class="cdesc">Comisión por el lead trabajado / agendado.</p><div id="setTbl"><div class="empty" style="padding:24px">Cargando…</div></div></div>
      <div class="card" style="margin:0"><h3>Closers</h3><p class="cdesc">Comisión por la venta cerrada.</p><div id="cloTbl"><div class="empty" style="padding:24px">Cargando…</div></div></div>
    </div>
    <p class="cdesc" style="margin:0 30px 24px">La comisión se genera sobre la plata efectivamente cobrada (cuotas en estado cobrado). Cada venta congela el % del momento.</p>`
  document.getElementById('cm_lanz').onchange=e=>{comLanzFilter=e.target.value;renderComisiones()}
  const nb=document.getElementById('cm_lanzmgr');if(nb)nb.onclick=openLanzModal
  if(isMgr())renderComConfig()
  let vq=sb.from('ventas').select('id,cliente,lead_id,leads(nombre),setter_id,closer_id,com_setter_pct,com_closer_pct,lanzamiento_id')
  if(comLanzFilter!=='all')vq=vq.eq('lanzamiento_id',comLanzFilter)
  const{data:ventas,error:ve}=await vq
  if(ve){document.getElementById('setTbl').innerHTML=`<div class="empty" style="padding:24px">Error: ${esc(ve.message)}</div>`;return}
  const vmap={};(ventas||[]).forEach(v=>vmap[v.id]=v)
  let q=sb.from('cuotas').select('id,monto_usd,venta_id,ventas!inner(lanzamiento_id)').eq('estado','cobrado').limit(10000)
  if(comLanzFilter!=='all')q=q.eq('ventas.lanzamiento_id',comLanzFilter)
  const{data:cuotas}=await q
  let sq=sb.from('senas').select('id,monto_usd,venta_id,ventas!inner(lanzamiento_id)').eq('estado','aplicada').limit(10000)
  if(comLanzFilter!=='all')sq=sq.eq('ventas.lanzamiento_id',comLanzFilter)
  const{data:senas}=await sq
  let pq=sb.from('comision_pagos').select('origen_tipo,origen_id,rol').limit(20000)
  if(comLanzFilter!=='all')pq=pq.eq('lanzamiento_id',comLanzFilter)
  const{data:pagos}=await pq
  const paid=new Set((pagos||[]).map(p=>p.origen_tipo+':'+p.origen_id+':'+p.rol))
  const lines=[],ventasConCobro=new Set()
  const push=(tipo,id,base,v)=>{const label=(v.leads&&v.leads.nombre)||v.cliente||'—'
    if(v.setter_id)lines.push({tipo,id,ventaId:v.id,rol:'setter',personaId:v.setter_id,base,pct:Number(v.com_setter_pct||0),monto:base*Number(v.com_setter_pct||0)/100,label,lanzId:v.lanzamiento_id})
    if(v.closer_id)lines.push({tipo,id,ventaId:v.id,rol:'closer',personaId:v.closer_id,base,pct:Number(v.com_closer_pct||0),monto:base*Number(v.com_closer_pct||0)/100,label,lanzId:v.lanzamiento_id})}
  ;(cuotas||[]).forEach(c=>{const v=vmap[c.venta_id];if(!v)return;ventasConCobro.add(c.venta_id);push('cuota',c.id,Number(c.monto_usd||0),v)})
  ;(senas||[]).forEach(s=>{const v=vmap[s.venta_id];if(!v||!ventasConCobro.has(s.venta_id))return;push('sena',s.id,Number(s.monto_usd||0),v)})
  COM_LINES=lines;COM_PAID=paid
  const roleAgg=rol=>{const o={};lines.filter(l=>l.rol===rol).forEach(l=>{const a=o[l.personaId]=o[l.personaId]||{dev:0,pag:0};a.dev+=l.monto;if(paid.has(l.tipo+':'+l.id+':'+l.rol))a.pag+=l.monto});return o}
  const setAgg=roleAgg('setter'),cloAgg=roleAgg('closer')
  const tot=o=>Object.values(o).reduce((a,x)=>({dev:a.dev+x.dev,pag:a.pag+x.pag}),{dev:0,pag:0})
  const ts=tot(setAgg),tc=tot(cloAgg),dev=ts.dev+tc.dev,pag=ts.pag+tc.pag
  document.getElementById('ck').innerHTML=[['Ganado',money(dev)],['Pagado',money(pag)],['Pendiente',money(dev-pag)]].map(([l,n])=>`<div class="fcell"><div class="n" style="font-size:24px">${n}</div><div class="l">${l}</div></div>`).join('')
  const tbl=(o,rol)=>{const list=Object.keys(o).map(id=>{const p=state.setters.find(x=>x.id===id);return{id,nombre:(p&&p.nombre)||'—',dev:o[id].dev,pag:o[id].pag,pend:o[id].dev-o[id].pag}}).sort((a,b)=>b.pend-a.pend)
    return list.length?`<div class="tablewrap" style="margin:0"><table><thead><tr><th>Persona</th><th>Ganado</th><th>Pagado</th><th>Pend.</th><th></th></tr></thead><tbody>${list.map(r=>`<tr><td><span class="nm" data-det="${rol}|${r.id}" style="cursor:pointer;border-bottom:1px dotted var(--faint)">${esc(r.nombre)}</span></td><td>${money(r.dev)}</td><td>${money(r.pag)}</td><td class="nm" style="color:${r.pend>0.001?'var(--warn)':'var(--good)'}">${money(r.pend)}</td><td><button class="pg" data-det="${rol}|${r.id}">ver ventas</button></td></tr>`).join('')}</tbody></table></div>`:`<div class="empty" style="padding:24px">Sin comisiones en este lanzamiento.</div>`}
  document.getElementById('setTbl').innerHTML=tbl(setAgg,'setter')
  document.getElementById('cloTbl').innerHTML=tbl(cloAgg,'closer')
  document.querySelectorAll('[data-det]').forEach(b=>b.onclick=()=>{const parts=b.dataset.det.split('|');openComDetalle(parts[0],parts[1])})}
function openComDetalle(rol,personaId){
  const p=state.setters.find(x=>x.id===personaId),nombre=(p&&p.nombre)||'—'
  const mine=COM_LINES.filter(l=>l.rol===rol&&l.personaId===personaId)
  const ov=document.createElement('div');ov.className='overlay';let changed=false
  const keyOf=l=>l.tipo+':'+l.id+':'+l.rol
  const groups=()=>{const g={},ord=[];mine.forEach((l,i)=>{const k=String(l.ventaId);if(!g[k]){g[k]={label:l.label,items:[]};ord.push(k)}g[k].items.push({l,i})});return{g,ord}}
  const body=()=>{const{g,ord}=groups();if(!ord.length)return ''
    return ord.map(k=>{const grp=g[k],sub=grp.items.reduce((a,x)=>a+x.l.monto,0),pag=grp.items.reduce((a,x)=>a+(COM_PAID.has(keyOf(x.l))?x.l.monto:0),0)
      const est=pag>=sub-0.001?'<span class="chip cobrado">pagada</span>':pag>0?'<span class="chip potencial">parcial</span>':'<span class="chip pendiente">pendiente</span>'
      const head=`<tr><td class="nm">${esc(grp.label)}</td><td></td><td></td><td class="nm">${money(sub)}</td><td>${est}</td>${isMgr()?`<td><button class="pg" data-togv="${k}">${pag>=sub-0.001?'desmarcar':'pagar venta'}</button></td>`:''}</tr>`
      const rows=grp.items.map(({l,i})=>{const pd=COM_PAID.has(keyOf(l))
        return `<tr><td class="sub2" style="padding-left:22px">↳ ${l.tipo==='sena'?'seña':'cuota'}</td><td class="sub2">${money(l.base)}</td><td class="sub2">${l.pct}%</td><td>${money(l.monto)}</td><td>${pd?'<span class="chip cobrado">pagada</span>':'<span class="chip pendiente">pend.</span>'}</td>${isMgr()?`<td><button class="pg" data-tog="${i}">${pd?'quitar':'pagar'}</button></td>`:''}</tr>`}).join('')
      return head+rows}).join('')}
  const totals=()=>{const dev=mine.reduce((a,l)=>a+l.monto,0),pag=mine.reduce((a,l)=>a+(COM_PAID.has(keyOf(l))?l.monto:0),0);return{dev,pag}}
  const draw=()=>{const t=totals();ov.querySelector('#cd_sum').textContent=`Comisión total ${money(t.dev)} · Pagado ${money(t.pag)} · Pendiente ${money(t.dev-t.pag)}`;ov.querySelector('#cd_body').innerHTML=body()||`<tr><td colspan="6" class="empty">Sin ventas con comisión todavía.</td></tr>`;wire()}
  const setPaid=async(l,val)=>{const m={origen_tipo:l.tipo,origen_id:l.id,rol:l.rol}
    if(val){const{error}=await sb.from('comision_pagos').upsert({...m,persona_id:l.personaId,lanzamiento_id:l.lanzId||null,monto_usd:l.monto,pagado_by:me.id,pagado_at:new Date().toISOString()},{onConflict:'origen_tipo,origen_id,rol'});if(error){toast('Error: '+error.message);return}COM_PAID.add(keyOf(l))}
    else{const{error}=await sb.from('comision_pagos').delete().match(m);if(error){toast('Error: '+error.message);return}COM_PAID.delete(keyOf(l))}
    changed=true}
  function wire(){
    ov.querySelectorAll('[data-tog]').forEach(b=>b.onclick=async()=>{const l=mine[Number(b.dataset.tog)];await setPaid(l,!COM_PAID.has(keyOf(l)));draw()})
    ov.querySelectorAll('[data-togv]').forEach(b=>b.onclick=async()=>{const grp=mine.filter(l=>String(l.ventaId)===b.dataset.togv),allPaid=grp.every(l=>COM_PAID.has(keyOf(l)));for(const l of grp)await setPaid(l,!allPaid);draw()})}
  ov.innerHTML=`<div class="modal" style="max-width:720px"><h2>${esc(nombre)} · comisión ${rol}</h2>
    <p class="cdesc" id="cd_sum"></p>
    ${isMgr()?'<div class="actions" style="margin:0 0 12px"><button class="btn ghost" id="cd_all">Marcar todo pagado</button></div>':''}
    <div class="tablewrap" style="margin:0"><table><thead><tr><th>Venta / origen</th><th>Base</th><th>%</th><th>Comisión</th><th>Estado</th>${isMgr()?'<th></th>':''}</tr></thead><tbody id="cd_body"></tbody></table></div>
    <div class="actions"><div class="grow"></div><button class="btn primary" id="cd_close">Cerrar</button></div></div>`
  document.body.appendChild(ov);draw()
  if(isMgr()){const ab=ov.querySelector('#cd_all');if(ab)ab.onclick=async()=>{for(const l of mine){if(!COM_PAID.has(keyOf(l)))await setPaid(l,true)}draw();toast('Marcadas ✓')}}
  const close=()=>{ov.remove();if(changed)renderComisiones()}
  ov.onclick=e=>{if(e.target===ov)close()};ov.querySelector('#cd_close').onclick=close}
async function openLanzModal(){
  const{data:lanzs}=await sb.from('lanzamientos').select('*').order('numero',{ascending:true,nullsFirst:false}).order('created_at')
  const ov=document.createElement('div');ov.className='overlay'
  const rowsHtml=(lanzs||[]).map(l=>`<tr data-l="${l.id}"><td><input class="inp lnum" type="number" value="${l.numero!=null?l.numero:''}" style="max-width:80px"/></td><td><input class="inp lnom" value="${esc(l.nombre||'')}"/></td><td>${l.activo?'<span class="chip cobrado">activo</span>':`<button class="pg" data-act="${l.id}">activar</button>`}</td><td><button class="pg" data-save="${l.id}">guardar</button></td></tr>`).join('')
  ov.innerHTML=`<div class="modal" style="max-width:640px"><h2>Lanzamientos</h2>
    <p class="cdesc">Numerá o renombrá tus lanzamientos, y elegí cuál está activo (donde se cargan las ventas y leads nuevos).</p>
    <div class="tablewrap" style="margin:0 0 16px"><table><thead><tr><th>N°</th><th>Nombre</th><th>Estado</th><th></th></tr></thead><tbody>${rowsHtml||'<tr><td colspan="4" class="empty">Sin lanzamientos.</td></tr>'}</tbody></table></div>
    <div class="sechead">Nuevo lanzamiento</div>
    <div class="row3"><div class="field"><label>Número</label><input class="inp" id="l_num" type="number" placeholder="7"/></div><div class="field" style="grid-column:span 2"><label>Nombre</label><input class="inp" id="l_nom" placeholder="Lanzamiento 7"/></div></div>
    <div class="actions"><button class="btn ghost" id="l_add">+ Crear y activar</button><div class="grow"></div><button class="btn primary" id="l_close">Cerrar</button></div></div>`
  document.body.appendChild(ov);ov.onclick=e=>{if(e.target===ov)ov.remove()};ov.querySelector('#l_close').onclick=()=>ov.remove()
  ov.querySelectorAll('[data-save]').forEach(b=>b.onclick=async()=>{const tr=b.closest('tr'),num=tr.querySelector('.lnum').value,nom=tr.querySelector('.lnom').value.trim()
    const{error}=await sb.from('lanzamientos').update({numero:num!==''?Number(num):null,nombre:nom}).eq('id',b.dataset.save);if(error){toast('Error: '+error.message);return}
    if(state.lanz&&state.lanz.id===b.dataset.save){state.lanz.numero=num!==''?Number(num):null;state.lanz.nombre=nom};toast('Guardado ✓')})
  ov.querySelectorAll('[data-act]').forEach(b=>b.onclick=async()=>{await sb.from('lanzamientos').update({activo:false}).eq('activo',true)
    const{data,error}=await sb.from('lanzamientos').update({activo:true}).eq('id',b.dataset.act).select().single();if(error){toast('Error: '+error.message);return}
    state.lanz=data;comLanzFilter=data.id;toast('Lanzamiento activado ✓');ov.remove();renderComisiones()})
  ov.querySelector('#l_add').onclick=async()=>{const num=document.getElementById('l_num').value,nom=document.getElementById('l_nom').value.trim()||('Lanzamiento '+(num||''))
    await sb.from('lanzamientos').update({activo:false}).eq('activo',true)
    const{data,error}=await sb.from('lanzamientos').insert({numero:num!==''?Number(num):null,nombre:nom,activo:true}).select().single();if(error){toast('Error: '+error.message);return}
    state.lanz=data;comLanzFilter=data.id;toast('Lanzamiento creado ✓');ov.remove();renderComisiones()}}
async function renderComConfig(){const{data:profs}=await sb.from('profiles').select('id,nombre,rol,com_setter_pct,com_closer_pct').eq('activo',true).order('rol')
  document.getElementById('cfgWrap').innerHTML=`<div class="card"><h3>Porcentajes por persona</h3><p class="cdesc">Se aplican a las próximas ventas. Las ya cargadas conservan el % con el que se guardaron.</p>
    <div class="tablewrap" style="margin:0"><table><thead><tr><th>Persona</th><th>Rol</th><th>% como setter</th><th>% como closer</th><th></th></tr></thead><tbody>${(profs||[]).map(p=>`<tr data-p="${p.id}"><td class="nm">${esc(p.nombre)}</td><td class="sub2">${esc(p.rol)}</td><td><input class="inp cs" type="number" step="0.5" value="${p.com_setter_pct||0}" style="max-width:110px"/></td><td><input class="inp cc" type="number" step="0.5" value="${p.com_closer_pct||0}" style="max-width:110px"/></td><td><button class="pg" data-save="${p.id}">Guardar</button></td></tr>`).join('')}</tbody></table></div></div>`
  document.querySelectorAll('[data-save]').forEach(b=>b.onclick=async()=>{const tr=b.closest('tr'),cs=Number(tr.querySelector('.cs').value||0),cc=Number(tr.querySelector('.cc').value||0)
    const{error}=await sb.from('profiles').update({com_setter_pct:cs,com_closer_pct:cc}).eq('id',b.dataset.save);if(error){toast('Error: '+error.message);return}
    const s=state.setters.find(x=>x.id===b.dataset.save);if(s){s.com_setter_pct=cs;s.com_closer_pct=cc};toast('Guardado ✓')})}

/* ================= CALENDARIO ================= */
async function renderCalendario(){view().innerHTML=head('AGENDA','Calendario')+`<div class="card"><div class="agenda" id="ag"></div></div>`
  const{data:clases}=await sb.from('clases').select('*').order('fecha')
  let sq=sb.from('seguimientos').select('*,leads(nombre)').eq('hecho',false).order('fecha_programada');if(!isMgr())sq=sq.eq('asesor_id',me.id)
  const{data:segs}=await sq
  const items=[]
  ;(clases||[]).forEach(c=>c.fecha&&items.push({d:c.fecha.slice(0,10),tg:'CLASE',t:'Clase '+c.numero+(c.titulo?' — '+c.titulo:'')}))
  ;(segs||[]).forEach(s=>s.fecha_programada&&items.push({d:s.fecha_programada,tg:'SEGUIMIENTO',t:(s.leads?s.leads.nombre:'Lead')+' — '+(s.nota||s.tipo||'')}))
  items.sort((a,b)=>a.d.localeCompare(b.d))
  const byDay={};items.forEach(i=>{(byDay[i.d]=byDay[i.d]||[]).push(i)})
  const days=Object.keys(byDay)
  document.getElementById('ag').innerHTML=days.length?days.map(d=>`<div class="day">${new Date(d+'T00:00').toLocaleDateString('es',{weekday:'long',day:'2-digit',month:'long'})}</div>${byDay[d].map(i=>`<div class="ev"><span class="tg">${i.tg}</span><span>${esc(i.t)}</span></div>`).join('')}`).join(''):`<div class="empty">No hay clases ni seguimientos agendados.</div>`}

/* ================= BOOT (al final: después de todas las declaraciones, para evitar TDZ) ================= */
if(!SUPABASE_URL||!SUPABASE_ANON_KEY){renderConfigNeeded()}
else{try{sb=createClient(SUPABASE_URL,SUPABASE_ANON_KEY)
  const{data:{session}}=await sb.auth.getSession()
  if(session)await afterLogin(session);else renderLogin()
  sb.auth.onAuthStateChange((_e,s)=>{if(!s)renderLogin()})
}catch(e){console.error('boot',e);renderError(e)}}
</script>
