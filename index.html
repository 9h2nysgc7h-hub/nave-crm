<style>

  *{box-sizing:border-box}html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}

  .btn{border:none;border-radius:9px;padding:9px 14px;font-size:13px;font-weight:650}
  .btn.primary{background:var(--accent);color:#04121a}.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line-2)}
  .btn.danger{background:transparent;color:var(--danger);border:1px solid var(--line-2)}.btn:hover{filter:brightness(1.08)}
  .inp,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:9px;color:var(--ink);padding:9px 11px;font-size:13.5px;font-family:inherit;outline:none;width:100%}

  .brand .wm b{display:block;font-weight:800;font-size:15px;letter-spacing:.02em}.brand .wm span{font-family:var(--mono);font-size:9px;letter-spacing:.26em;color:var(--muted);text-transform:uppercase}
  .nav{padding:6px 10px;overflow-y:auto;flex:1}.grp{font-family:var(--mono);font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--faint);padding:14px 12px 6px}
  .nav a{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:9px;color:var(--muted);text-decoration:none;font-size:13.5px;margin-bottom:1px;cursor:pointer}
  .nav a .ic{width:16px;height:16px;opacity:.85;flex:none}.nav a:hover{background:var(--surface);color:var(--ink)}
  .nav a.on{background:linear-gradient(90deg,var(--accent-glow),transparent);color:var(--ink);box-shadow:inset 2px 0 0 var(--accent)}
  .me{border-top:1px solid var(--line);padding:12px 16px;display:flex;align-items:center;gap:10px}

  .me .nm{font-size:12.5px;font-weight:600;line-height:1.2}.me .rl{font-family:var(--mono);font-size:9.5px;color:var(--faint)}.me .out{margin-left:auto;color:var(--faint);background:none;border:none;font-size:16px}
  .main{overflow-y:auto;height:100vh}

  .top h1{margin:0;font-size:27px;font-weight:800;letter-spacing:-.02em}.top .sub{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.04em;margin-bottom:5px}
  .grow{flex:1}
  .funnel{display:grid;grid-template-columns:repeat(5,1fr);gap:16px;padding:10px 30px 24px}
  @media(max-width:1180px){.funnel{grid-template-columns:repeat(3,1fr)}}@media(max-width:720px){.funnel{grid-template-columns:repeat(2,1fr)}}

  .fcell .ic2{position:absolute;right:18px;top:18px;width:18px;height:18px;color:var(--accent);opacity:.85}
  .fcell .n{font-size:34px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1}
  .fcell .l{font-family:var(--mono);font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-top:10px}
  .fcell .pct{font-family:var(--mono);font-size:11.5px;color:var(--accent);margin-top:12px}
  .fcell .track{height:4px;border-radius:3px;background:var(--surface-2);margin-top:10px;overflow:hidden}.fcell .track>i{display:block;height:100%;background:var(--accent);border-radius:3px}
  .tb{display:flex;gap:9px;align-items:center;padding:4px 30px 14px;flex-wrap:wrap}.search{min-width:230px;max-width:300px}
  .pill{background:var(--surface);border:1px solid var(--line);color:var(--muted);border-radius:20px;padding:7px 13px;font-size:12px;cursor:pointer}.pill.on{border-color:var(--accent);color:var(--ink)}
  select.pill{-webkit-appearance:none;appearance:none;width:auto}
  .tablewrap{margin:0 30px 30px;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface)}

  thead th{text-align:left;font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);font-weight:600;padding:12px 14px;border-bottom:1px solid var(--line);background:var(--bg-2)}
  tbody td{padding:15px 16px;border-bottom:1px solid var(--line);color:var(--muted);vertical-align:middle}tbody tr:last-child td{border-bottom:none}tbody tr.clk:hover{background:var(--surface-2);cursor:pointer}
  .nm{color:var(--ink);font-weight:600}.sub2{font-size:11.5px;color:var(--faint)}
  .chip{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;padding:3px 8px;border-radius:20px}
  .chip.fluido{color:var(--fluido);background:rgba(70,224,160,.12)}.chip.potencial{color:var(--potencial);background:rgba(224,178,74,.12)}.chip.leve{color:var(--leve);background:rgba(124,134,152,.14)}
  .chip.pendiente{color:var(--warn);background:rgba(224,178,74,.12)}.chip.cobrado{color:var(--good);background:rgba(70,224,160,.12)}.chip.vencido{color:var(--danger);background:rgba(240,101,79,.12)}
  .chip.advertencia{color:var(--warn);background:rgba(224,178,74,.12)}.chip.strike{color:var(--danger);background:rgba(240,101,79,.12)}.chip.vetado{color:#fff;background:var(--danger)}
  .faltas{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:14px}
  @media (max-width:760px){.faltas{grid-template-columns:1fr}}
  .falta-card{background:var(--surface-2);border:1px solid var(--line);border-left:4px solid var(--warn);border-radius:8px;padding:18px 20px}
  .falta-card.grave{border-left-color:var(--danger)}
  .falta-tag{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:4px 10px;border-radius:20px;margin-bottom:12px;background:rgba(224,178,74,.12);color:var(--warn)}
  .falta-card.grave .falta-tag{background:rgba(240,101,79,.12);color:var(--danger)}
  .falta-card h4{margin:0 0 10px;font-size:13.5px;color:var(--ink)}
  .falta-card ul{margin:0;padding-left:18px;color:var(--muted);font-size:13.5px}
  .falta-card ul li{margin-bottom:8px}
  .estado{display:inline-flex;align-items:center;gap:7px;color:var(--ink);font-size:12.5px}.dot{width:7px;height:7px;border-radius:50%;background:var(--accent)}
  .who{display:inline-flex;align-items:center;gap:7px}.who .a{width:22px;height:22px;border-radius:50%;background:#222838;display:grid;place-items:center;font-size:10px;color:var(--ink);font-weight:700}
  .foot{display:flex;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid var(--line);color:var(--faint);font-family:var(--mono);font-size:11px}
  .pg{background:var(--surface-2);border:1px solid var(--line-2);border-radius:7px;color:var(--muted);padding:5px 10px;cursor:pointer;font-family:var(--mono);font-size:11px}.pg[disabled]{opacity:.4;cursor:default}
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;z-index:60;overflow-y:auto}
  .modal{background:var(--surface);border:1px solid var(--line);border-radius:18px;width:100%;max-width:540px;padding:22px;position:relative;z-index:61}.modal h2{margin:0 0 16px;font-size:18px}
  .field{margin-bottom:13px}.row2{display:grid;grid-template-columns:1fr 1fr;gap:11px}.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:11px}@media(max-width:640px){.row2,.row3{grid-template-columns:1fr}}
  .actions{display:flex;gap:9px;margin-top:8px;align-items:center}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px;margin:0 30px 20px}
  .card h3{margin:0 0 4px;font-size:16px}.card .cdesc{color:var(--muted);font-size:13px;margin:0 0 16px}
  .sechead{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin:6px 0 12px}
  .tabs{display:flex;gap:6px;padding:0 30px 14px}.tab{background:var(--surface);border:1px solid var(--line);color:var(--muted);border-radius:9px;padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer}.tab.on{background:var(--surface-2);color:var(--ink);border-color:var(--accent)}
  .attend{display:flex;gap:8px}.clbtn{flex:1;padding:9px;border-radius:9px;border:1px solid var(--line-2);background:var(--surface);color:var(--muted);font-size:12.5px;cursor:pointer}.clbtn.yes{background:rgba(70,207,230,.15);border-color:var(--accent-dim);color:var(--accent)}
  .bars{display:flex;align-items:flex-end;gap:18px;height:180px;padding:16px 6px 0}.bar{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;justify-content:flex-end;height:100%}
  .bar .col{width:60%;max-width:64px;background:linear-gradient(180deg,var(--accent),var(--accent-dim));border-radius:8px 8px 0 0;min-height:3px}.bar .bl{font-size:12px;color:var(--muted)}.bar .bn{font-family:var(--mono);font-size:12px;color:var(--ink)}
  .agenda .day{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin:16px 0 8px}
  .ev{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:12px 14px;margin-bottom:8px}
  .ev .tg{font-family:var(--mono);font-size:10px;color:var(--faint);text-transform:uppercase;border:1px solid var(--line-2);border-radius:6px;padding:2px 7px}
  .stub{margin:40px 30px;padding:50px 30px;border:1px dashed var(--line-2);border-radius:16px;text-align:center;color:var(--faint)}.stub b{color:var(--ink);display:block;font-size:16px;margin-bottom:6px}
  .empty{padding:44px;text-align:center;color:var(--faint);font-size:14px}
  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--surface-2);border:1px solid var(--line-2);color:var(--ink);padding:11px 18px;border-radius:11px;font-size:13px;z-index:90;opacity:0;transition:opacity .2s}.toast.show{opacity:1}
  .mapgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;align-items:center;margin:6px 0 14px}.mapgrid .csvcol{font-size:13px;color:var(--ink);font-family:var(--mono)}
  .split{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin:0 30px 20px}@media(max-width:900px){.split{grid-template-columns:1fr}}
  .listrow{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}.listrow:last-child{border:none}
</style></head>
<body>
<div class="glow"></div><div id="root"></div><div id="toast" class="toast"></div>
<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2'
/* ===== CONFIG — completá antes de deployar (Supabase → Settings → API) ===== */
const SUPABASE_URL = 'https://mnsbmrzeltolhkzdbaop.supabase.co'
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1uc2JtcnplbHRvbGhremRiYW9wIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU5NTEyODcsImV4cCI6MjEwMTUyNzI4N30.Zb0JD1dx2xiqmc_-mvtOU6dYhtjV8MYq7tbLg8r1Wgg'

const ROCKET=`<svg viewBox="0 0 48 48" fill="none"><g fill="currentColor"><path d="M20.4 8.6 L32.6 20.4 Q27.4 20 25.7 22.2 Q24.4 23.9 24 26.6 Q23.1 22.6 20.4 21.4 Q17.7 20.2 14 20.8 Z"/><path d="M24 26.4 C31.6 33.4 29.4 42.2 14.6 43.4 C23.8 40 25.2 31.6 21.8 27.6 Z"/></g></svg>`
const root=document.getElementById('root')
let sb=null,me=null,myProfile=null
let state={setters:[],lanz:null,ctxQ:'',ctxFilter:'',fichas:[]}
const esc=s=>(s??'').toString().replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))
const initials=n=>(n||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase()
const isMgr=()=>myProfile&&(myProfile.rol==='manager'||myProfile.rol==='admin')
const num=n=>(Number(n||0)).toLocaleString('es')
const nameOf=id=>{const s=state.setters.find(x=>x.id===id);return s?s.nombre:null}
const rolOf=id=>{const s=state.setters.find(x=>x.id===id);return s?s.rol:null}
// Supabase no tira error si RLS bloquea un update/delete: simplemente afecta 0 filas.
// Estos helpers chequean que realmente se haya afectado algo y avisan si no.
async function delRow(table,id){const{data,error}=await sb.from(table).delete().eq('id',id).select('id')
  if(error)return{ok:false,msg:error.message}
  if(!data||!data.length)return{ok:false,msg:'No se borró nada — probablemente no tenés permiso (revisá las políticas RLS en Supabase).'}
  return{ok:true}}
async function updRow(table,id,patch){const{data,error}=await sb.from(table).update(patch).eq('id',id).select('id')
  if(error)return{ok:false,msg:error.message}
  if(!data||!data.length)return{ok:false,msg:'No se guardó nada — probablemente no tenés permiso (revisá las políticas RLS en Supabase).'}
  return{ok:true}}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1900)}
function fmtDate(s){if(!s)return'—';const d=new Date(s),n=new Date();if(d.toDateString()===n.toDateString())return'hoy '+d.toLocaleTimeString('es',{hour:'2-digit',minute:'2-digit'});return d.toLocaleDateString('es',{day:'2-digit',month:'2-digit'})}
// Fecha y hora exacta de carga (created_at) — siempre con hora, a diferencia de fmtDate.
function fmtDateTime(s){if(!s)return'—';const d=new Date(s);return d.toLocaleDateString('es',{day:'2-digit',month:'2-digit',year:'2-digit'})+' '+d.toLocaleTimeString('es',{hour:'2-digit',minute:'2-digit'})}
function view(){return document.getElementById('view')}

/* ---------- BOOT ---------- */
function renderError(e){root.innerHTML=`<div class="login"><div class="box"><div class="brand">${ROCKET}<div class="wm"><b>NAVE</b><span>Instituto · CRM</span></div></div><h1>Ups, algo falló al cargar</h1><p>${esc((e&&e.message)||e||'Error desconocido')}</p><button class="btn primary" style="width:100%" onclick="location.reload()">Reintentar</button><div class="alt"><a onclick="(async()=>{await sb.auth.signOut();location.reload()})()">Cerrar sesión y volver a entrar</a></div></div></div>`}
window.addEventListener('error',ev=>console.error('window error',ev.error||ev.message))
function renderConfigNeeded(){root.innerHTML=`<div class="login"><div class="box"><div class="brand">${ROCKET}<div class="wm"><b>NAVE</b><span>Instituto · CRM</span></div></div><h1>Falta conectar Supabase</h1><p>Completá <code>SUPABASE_URL</code> y <code>SUPABASE_ANON_KEY</code> arriba de <code>index.html</code> (Supabase → Settings → API) y volvé a deployar. El SQL está en <code>schema.sql</code>.</p></div></div>`}

/* ---------- AUTH ---------- */
function renderLogin(){
  root.innerHTML=`<div class="login"><div class="box"><div class="brand">${ROCKET}<div class="wm"><b>NAVE</b><span>Instituto · CRM</span></div></div>
    <h1 id="lt">Ingresá</h1><p id="ls">Accedé con tu cuenta del equipo.</p>
    <div class="field"><label>Email</label><input class="inp" id="le" type="email" placeholder="vos@nave.com"/></div>
    <div class="field"><label>Contraseña</label><input class="inp" id="lp" type="password" placeholder="••••••••"/></div>
    <div class="field" id="lnw" style="display:none"><label>Tu nombre</label><input class="inp" id="ln" placeholder="Nombre y apellido"/></div>
    <button class="btn primary" id="lb" style="width:100%;margin-top:6px">Entrar</button><div class="err" id="lerr"></div>
    <div class="alt">¿No tenés cuenta? <a id="ltg">Crear una</a></div></div></div>`
  let m='in';const $=id=>document.getElementById(id)
  $('ltg').onclick=()=>{m=m==='in'?'up':'in';$('lt').textContent=m==='in'?'Ingresá':'Crear cuenta';$('lnw').style.display=m==='in'?'none':'block';$('lb').textContent=m==='in'?'Entrar':'Crear cuenta';$('ltg').textContent=m==='in'?'Crear una':'Ya tengo cuenta'}
  $('lb').onclick=async()=>{const email=$('le').value.trim(),pass=$('lp').value,err=$('lerr');err.textContent=''
    if(!email||!pass){err.textContent='Completá email y contraseña.';return}$('lb').textContent='...'
    let r=m==='up'?await sb.auth.signUp({email,password:pass,options:{data:{nombre:$('ln').value.trim()}}}):await sb.auth.signInWithPassword({email,password:pass})
    if(r.error){err.textContent=r.error.message;$('lb').textContent=m==='in'?'Entrar':'Crear cuenta';return}
    if(r.data.session)await afterLogin(r.data.session);else err.textContent='Revisá tu email para confirmar la cuenta.'}
}
async function afterLogin(session){me=session.user
  try{const{data:prof}=await sb.from('profiles').select('*').eq('id',me.id).maybeSingle();if(prof)myProfile=prof}catch(e){console.error('profile',e)}
  if(!myProfile)myProfile={nombre:(me.email||'Usuario'),rol:'setter'}
  try{await ensureLanzamiento()}catch(e){console.error('lanz',e)}
  try{const{data:setters}=await sb.from('profiles').select('id,nombre,rol').eq('activo',true);state.setters=setters||[]}catch(e){console.error('setters',e)}
  if(!location.hash||location.hash==='#')location.hash='#/panel'
  renderShell();route()}
async function ensureLanzamiento(){let{data}=await sb.from('lanzamientos').select('*').eq('activo',true).order('created_at',{ascending:false}).limit(1)
  if(data&&data[0]){state.lanz=data[0];return}
  if(isMgr()){const{data:n}=await sb.from('lanzamientos').insert({nombre:'Lanzamiento actual',activo:true}).select().single();state.lanz=n}}

/* ---------- SHELL + ROUTER ---------- */
// Tercer elemento de cada item = roles (aparte de manager/admin, que siempre ven todo) que lo ven.
// null = todos los roles. [] = solo manager/admin.
const NAV=[
  {g:null,items:[['#/panel','Panel general',null],['#/kpis','KPIs',['setter']],['#/contexto','Contexto de leads',['setter','closer']],['#/strikes','Strikes',null],['#/equipo','Equipo',[]],['#/guia','Guía',null]]}]
function renderShell(){
  const canSee=roles=>isMgr()||!roles||roles.includes(myProfile.rol)
  const nav=NAV.map(s=>{const items=s.items.filter(([,,roles])=>canSee(roles));if(!items.length)return ''
    return `${s.g?`<div class="grp">${s.g}</div>`:''}${items.map(([h,l])=>`<a data-h="${h}"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="9"/></svg><span>${l}</span></a>`).join('')}`}).join('')
  root.innerHTML=`<div id="app"><aside class="side"><div class="brand">${ROCKET}<div class="wm"><b>NAVE</b><span>Instituto · CRM</span></div></div>
    <nav class="nav">${nav}</nav>
    <div class="me"><div class="av">${initials(myProfile.nombre)}</div><div><div class="nm">${esc(myProfile.nombre||me.email)}</div><div class="rl">${esc(myProfile.rol)}</div></div><button class="out" id="so" title="Salir">⎋</button></div>
    </aside><main class="main" id="view"></main></div>`
  root.querySelectorAll('.nav a').forEach(a=>a.onclick=()=>location.hash=a.dataset.h)
  document.getElementById('so').onclick=()=>sb.auth.signOut();window.onhashchange=route}
function setActive(){root.querySelectorAll('.nav a').forEach(a=>a.classList.toggle('on',a.dataset.h===location.hash))}
function route(){setActive();const h=location.hash
  const map={'#/panel':renderPanel,'#/contexto':renderContexto,'#/guia':renderGuia,'#/strikes':renderStrikes,'#/kpis':renderKpis,'#/equipo':renderEquipo}
  ;(map[h]||renderPanel)()}
function head(sub,title,actions=''){return `<div class="top"><div><div class="sub">${sub}</div><h1>${title}</h1></div><div class="grow"></div>${actions}</div>`}

/* ================= PANEL GENERAL ================= */
async function renderPanel(){
  view().innerHTML=head('DASHBOARD · '+esc((state.lanz&&state.lanz.nombre)||'LANZAMIENTO'),'Panel general',isMgr()?'<button class="btn ghost" id="p_lanz">Lanzamientos</button>':'')
    +`<div class="card"><h3>Estado del equipo</h3><p class="cdesc">Último KPI que dejó cada asesor — un solo número por persona, siempre el más actualizado.</p><div class="funnel" id="kpiresumen"></div></div>`
  const b=document.getElementById('p_lanz');if(b)b.onclick=openLanzModal
  loadKpiResumen()}
async function loadKpiResumen(){const el=document.getElementById('kpiresumen');if(!el)return
  const{data}=await sb.from('kpis_diarios').select('setter_id,fecha,leves,fluidos,potenciales,leads_sin_responder,agendas_dia').eq('lanzamiento_id',state.lanz.id).limit(10000)
  // Por si todavía no corriste la migración que deja un solo registro por
  // asesor: nos quedamos acá igual con el más reciente de cada uno, para
  // no sumar historial viejo por error mientras tanto.
  const ultimos={}
  ;(data||[]).forEach(x=>{const s=x.setter_id;if(!s)return
    if(!ultimos[s]||x.fecha>=ultimos[s].fecha)ultimos[s]=x})
  const filas=Object.values(ultimos)
  const sum=k=>filas.reduce((a,x)=>a+Number(x[k]||0),0)
  const cells=[['Sin responder',sum('leads_sin_responder')],['Leves',sum('leves')],['Fluidos',sum('fluidos')],['Potenciales',sum('potenciales')],['Agendas',sum('agendas_dia')]]
  const t=cells.reduce((a,[,n])=>a+n,0),pc=n=>t?Math.round(n/t*100):0
  el.innerHTML=filas.length?cells.map(([l,n])=>`<div class="fcell"><svg class="ic2" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="9"/></svg><div class="n">${num(n)}</div><div class="l">${l}</div><div class="pct">${t?pc(n)+'%':'—'}</div><div class="track"><i style="width:${pc(n)}%"></i></div></div>`).join(''):`<div class="empty" style="padding:16px">Todavía no se cargó ningún KPI.</div>`}
/* ================= CONTEXTO DE LEADS (setters + closers) ================= */
// Tabla aparte (`fichas_contexto`), sin agenda ni campos de embudo: el closer
// carga lo mínimo (nombre + lo que tenga) y cualquier setter/closer suma
// Situación/Objetivos/Dolores después. "Con/sin contexto" se deriva de si
// esos 3 campos están vacíos — no hay un estado separado que mantener.
async function renderContexto(){const v=view()
  v.innerHTML=head('SETTERS Y CLOSERS','Contexto de leads',`<button class="btn primary" id="cx_new">+ Nuevo</button>`)
    +`<div class="card"><p class="cdesc">Cuando un closer tiene una llamada y no tiene contexto del lead, lo carga acá con lo que tenga (nombre, teléfono). El setter que lo trabajó entra y completa Situación/Objetivos/Dolores — y cualquiera puede sumar algo más después de la llamada.</p></div>
    <div class="tb"><input class="inp search" id="cx_q" placeholder="Buscar nombre o teléfono…" value="${esc(state.ctxQ)}"/>
      <span class="pill ${!state.ctxFilter?'on':''}" data-cf="">Todos</span>
      <span class="pill ${state.ctxFilter==='sin'?'on':''}" data-cf="sin">Sin contexto</span>
      <span class="pill ${state.ctxFilter==='con'?'on':''}" data-cf="con">Con contexto</span></div>
    <div class="tablewrap"><table><thead><tr><th>Nombre</th><th>Teléfono</th><th>Asesor</th><th>Contexto</th><th>Cargado por</th><th>Actualizado</th></tr></thead><tbody id="cx_rows"><tr><td colspan="6" class="empty">Cargando…</td></tr></tbody></table></div>`
  v.querySelector('#cx_new').onclick=()=>openContextoModal()
  v.querySelector('#cx_q').oninput=e=>{clearTimeout(window._cxt);state.ctxQ=e.target.value;window._cxt=setTimeout(loadContexto,300)}
  v.querySelectorAll('[data-cf]').forEach(p=>p.onclick=()=>{state.ctxFilter=p.dataset.cf;loadContexto()})
  loadContexto()}
async function loadContexto(){const rows=document.getElementById('cx_rows');if(!rows)return
  let q=sb.from('fichas_contexto').select('*').order('updated_at',{ascending:false}).limit(300)
  if(state.lanz)q=q.eq('lanzamiento_id',state.lanz.id)
  if(state.ctxQ)q=q.or(`nombre.ilike.%${state.ctxQ}%,telefono.ilike.%${state.ctxQ}%`)
  const{data,error}=await q
  if(error){rows.innerHTML=`<tr><td colspan="6" class="empty">Error: ${esc(error.message)}</td></tr>`;return}
  const tiene=f=>!!(f.situacion||f.objetivos||f.dolor)
  let filas=data||[]
  if(state.ctxFilter==='sin')filas=filas.filter(f=>!tiene(f));else if(state.ctxFilter==='con')filas=filas.filter(tiene)
  state.fichas=filas
  rows.innerHTML=filas.length?filas.map(f=>`<tr class="clk" data-id="${f.id}"><td class="nm">${esc(f.nombre)}</td><td>${esc(f.telefono||'—')}</td><td>${f.asesor_id?esc(nameOf(f.asesor_id)):'<span class="sub2">— sin asignar</span>'}</td><td><span class="chip ${tiene(f)?'cobrado':'pendiente'}">${tiene(f)?'con contexto':'sin contexto'}</span></td><td class="sub2">${esc(nameOf(f.creado_por)||'—')}</td><td class="sub2">${fmtDate(f.updated_at)}</td></tr>`).join(''):`<tr><td colspan="6" class="empty">No hay leads cargados con estos filtros.</td></tr>`
  rows.querySelectorAll('tr[data-id]').forEach(tr=>tr.onclick=()=>openContextoModal(filas.find(x=>x.id===tr.dataset.id)))}
function openContextoModal(f){
  const l=f||{nombre:'',telefono:'',asesor_id:'',situacion:'',objetivos:'',dolor:''}
  const ov=document.createElement('div');ov.className='overlay'
  ov.innerHTML=`<div class="modal"><h2>${f?'Editar contexto':'Nuevo · lead que necesita contexto'}</h2>
    <div class="row2"><div class="field"><label>Nombre *</label><input class="inp" id="cx_nombre" value="${esc(l.nombre)}"/></div><div class="field"><label>Teléfono</label><input class="inp" id="cx_telefono" type="tel" value="${esc(l.telefono||'')}" placeholder="+54 9 ..."/></div></div>
    <div class="field"><label>Asesor <span class="sub2" style="font-weight:400">· el setter que lo trabajó, si se sabe</span></label><select id="cx_asesor"><option value="">— sin asignar —</option>${state.setters.filter(s=>s.rol==='setter').map(s=>`<option value="${s.id}" ${l.asesor_id===s.id?'selected':''}>${esc(s.nombre)}</option>`).join('')}</select><div class="sub2" id="cx_asesor_hint" style="margin-top:6px;min-height:15px"></div></div>
    <div class="field"><label>Situación actual</label><textarea class="inp" id="cx_situacion" rows="2">${esc(l.situacion||'')}</textarea></div>
    <div class="field"><label>Objetivos</label><textarea class="inp" id="cx_objetivos" rows="2">${esc(l.objetivos||'')}</textarea></div>
    <div class="field"><label>Dolores</label><textarea class="inp" id="cx_dolor" rows="2">${esc(l.dolor||'')}</textarea></div>
    <div class="actions">${f?'<button class="btn danger" id="cx_del">Eliminar</button>':''}<div class="grow"></div><button class="btn ghost" id="cx_cancel">Cancelar</button><button class="btn primary" id="cx_save">Guardar</button></div></div>`
  document.body.appendChild(ov);const g=id=>ov.querySelector('#'+id)
  ov.onclick=e=>{if(e.target===ov)ov.remove()};g('cx_cancel').onclick=()=>ov.remove()
  // Al tipear el teléfono, busca si ese número ya es un lead en el CRM y
  // muestra/autocompleta su asesor — así el closer no tiene que adivinar.
  let asesorTouched=!!l.asesor_id,telTimer
  g('cx_asesor').onchange=()=>asesorTouched=true
  g('cx_telefono').oninput=()=>{clearTimeout(telTimer);telTimer=setTimeout(buscarPorTelefono,350)}
  async function buscarPorTelefono(){
    const hint=g('cx_asesor_hint'),d=g('cx_telefono').value.replace(/\D/g,'').slice(-8)
    if(!state.lanz||d.length<6){hint.textContent='';return}
    hint.textContent='Buscando…'
    const{data}=await sb.from('leads').select('asesor_id').eq('lanzamiento_id',state.lanz.id).or(`telefono.ilike.%${d}%,contacto.ilike.%${d}%`).limit(20)
    if(g('cx_telefono').value.replace(/\D/g,'').slice(-8)!==d)return
    if(!data||!data.length){hint.textContent='Lead nuevo — no está en la base del CRM todavía.';return}
    const asesores=[...new Set(data.map(x=>x.asesor_id).filter(Boolean))]
    if(asesores.length===1){hint.innerHTML=`→ Ya está en la base, trabajado por <b style="color:var(--ink)">${esc(nameOf(asesores[0]))}</b>`
      if(!asesorTouched)g('cx_asesor').value=asesores[0]}
    else if(asesores.length>1)hint.textContent='→ Hay más de un lead con ese teléfono, con distintos asesores — revisalo a mano.'
    else hint.textContent='→ Ya está en la base, pero sin asesor asignado.'}
  if(l.telefono)buscarPorTelefono()
  g('cx_save').onclick=async()=>{const nombre=g('cx_nombre').value.trim();if(!nombre){toast('Poné un nombre');return}
    const p={nombre,telefono:g('cx_telefono').value.trim()||null,asesor_id:g('cx_asesor').value||null,situacion:g('cx_situacion').value.trim()||null,objetivos:g('cx_objetivos').value.trim()||null,dolor:g('cx_dolor').value.trim()||null,lanzamiento_id:state.lanz?state.lanz.id:null,updated_at:new Date().toISOString()}
    const res=f?await sb.from('fichas_contexto').update(p).eq('id',f.id):await sb.from('fichas_contexto').insert({...p,creado_por:me.id}).select().single()
    if(res.error){toast('Error: '+res.error.message);return}
    toast('Guardado ✓');ov.remove();if(location.hash==='#/contexto')loadContexto()}
  if(f)g('cx_del').onclick=async()=>{if(!confirm('¿Eliminar esta ficha?'))return
    const r=await delRow('fichas_contexto',f.id);if(!r.ok){toast(r.msg);return}
    toast('Eliminado ✓');ov.remove();if(location.hash==='#/contexto')loadContexto()}}

/* ================= KPIS ================= */
async function renderKpis(){
  view().innerHTML=head('SETTER','KPIs')+`<div class="card"><h3>Tus números</h3><p class="cdesc">Un solo registro por vos — cada vez que guardás, pisa tu último número (no se suma a lo anterior). No se acumula historial día a día.</p>
    <div class="row3"><div class="field"><label>Sin responder</label><input class="inp" id="k_sinresp" type="number" value="0"/></div><div class="field"><label>Leves</label><input class="inp" id="k_leves" type="number" value="0"/></div><div class="field"><label>Fluidos</label><input class="inp" id="k_fluidos" type="number" value="0"/></div></div>
    <div class="row2"><div class="field"><label>Potenciales</label><input class="inp" id="k_potenciales" type="number" value="0"/></div><div class="field"><label>Agendas</label><input class="inp" id="k_agdia" type="number" value="0"/></div></div>
    <div class="actions"><div class="sub2" id="k_last"></div><div class="grow"></div><button class="btn primary" id="k_save">Guardar</button></div></div>
    ${isMgr()?`<div class="card"><p class="cdesc" style="margin:0">Ordenado por el que más carga reportó. Las filas marcadas en rojo tienen más sumado en KPIs que leads reales asignados — ahí hay un número mal cargado, no es un cálculo que arreglemos con código: hay que pedirle a esa persona que vuelva a entrar y cargue el número correcto.</p></div>
    <div class="tablewrap"><table><thead><tr><th>Setter</th><th>Sin resp.</th><th>Leves</th><th>Fluidos</th><th>Potenc.</th><th>Agendas</th><th>Leads reales</th><th>Cargado</th><th></th></tr></thead><tbody id="khist"><tr><td colspan="9" class="empty">Cargando…</td></tr></tbody></table></div>`:''}`
  loadKActual()
  document.getElementById('k_save').onclick=async()=>{const g=id=>document.getElementById(id)
    const p={setter_id:me.id,lanzamiento_id:state.lanz.id,fecha:new Date().toISOString().slice(0,10),updated_at:new Date().toISOString(),leads_sin_responder:+g('k_sinresp').value,leves:+g('k_leves').value,fluidos:+g('k_fluidos').value,potenciales:+g('k_potenciales').value,agendas_dia:+g('k_agdia').value}
    const{error}=await sb.from('kpis_diarios').upsert(p,{onConflict:'setter_id,lanzamiento_id'});if(error){toast('Error: '+error.message);return};toast('Guardado ✓');loadKActual();if(isMgr())loadKhist()}
  if(isMgr())loadKhist()}
async function loadKActual(){
  const{data:k}=await sb.from('kpis_diarios').select('*').eq('setter_id',me.id).eq('lanzamiento_id',state.lanz.id).maybeSingle()
  const g=id=>document.getElementById(id)
  if(k){g('k_sinresp').value=k.leads_sin_responder||0;g('k_leves').value=k.leves||0;g('k_fluidos').value=k.fluidos||0;g('k_potenciales').value=k.potenciales||0;g('k_agdia').value=k.agendas_dia||0}
  const last=document.getElementById('k_last');if(last)last.textContent=k?('Último guardado: '+fmtDateTime(k.updated_at||k.created_at)):'Todavía no cargaste nada en este lanzamiento.'}
async function loadKhist(){const el=document.getElementById('khist');if(!el)return
  const{data}=await sb.from('kpis_diarios').select('*').eq('lanzamiento_id',state.lanz.id).limit(200)
  const{data:leadsData}=await sb.from('leads').select('asesor_id').eq('lanzamiento_id',state.lanz.id).limit(10000)
  const realPorSetter={}
  ;(leadsData||[]).forEach(l=>{if(l.asesor_id)realPorSetter[l.asesor_id]=(realPorSetter[l.asesor_id]||0)+1})
  const filas=(data||[]).map(k=>({...k,total:(k.leads_sin_responder||0)+(k.leves||0)+(k.fluidos||0)+(k.potenciales||0)})).sort((a,b)=>b.total-a.total)
  el.innerHTML=filas.length?filas.map(k=>{const real=realPorSetter[k.setter_id]||0,sospechoso=k.total>real
    return `<tr${sospechoso?' style="background:rgba(240,101,79,.1)"':''}><td class="nm">${esc(nameOf(k.setter_id)||'—')}</td><td>${k.leads_sin_responder||0}</td><td>${k.leves||0}</td><td>${k.fluidos||0}</td><td>${k.potenciales||0}</td><td>${k.agendas_dia||0}</td><td class="sub2"${sospechoso?' style="color:var(--danger)"':''}>${real}${sospechoso?' ⚠':''}</td><td class="sub2">${fmtDateTime(k.updated_at||k.created_at)}</td><td><button class="pg" data-kdel="${k.id}">Borrar</button></td></tr>`}).join(''):`<tr><td colspan="9" class="empty">Sin registros todavía.</td></tr>`
  document.querySelectorAll('[data-kdel]').forEach(b=>b.onclick=async()=>{if(!confirm('¿Borrar el registro de KPIs de este asesor?'))return;const r=await delRow('kpis_diarios',b.dataset.kdel);if(!r.ok){toast(r.msg);return};toast('Borrado ✓');loadKhist()})}

async function openLanzModal(){
  const{data:lanzs}=await sb.from('lanzamientos').select('*').order('numero',{ascending:true,nullsFirst:false}).order('created_at')
  const ov=document.createElement('div');ov.className='overlay'
  const rowsHtml=(lanzs||[]).map(l=>`<tr data-l="${l.id}"><td><input class="inp lnum" type="number" value="${l.numero!=null?l.numero:''}" style="max-width:80px"/></td><td><input class="inp lnom" value="${esc(l.nombre||'')}"/></td><td>${l.activo?'<span class="chip cobrado">activo</span>':`<button class="pg" data-act="${l.id}">activar</button>`}</td><td><button class="pg" data-save="${l.id}">guardar</button></td></tr>`).join('')
  ov.innerHTML=`<div class="modal" style="max-width:640px"><h2>Lanzamientos</h2>
    <p class="cdesc">Numerá o renombrá tus lanzamientos, y elegí cuál está activo (donde se cargan las ventas y leads nuevos).</p>
    <div class="tablewrap" style="margin:0 0 16px"><table><thead><tr><th>N°</th><th>Nombre</th><th>Estado</th><th></th></tr></thead><tbody>${rowsHtml||'<tr><td colspan="4" class="empty">Sin lanzamientos.</td></tr>'}</tbody></table></div>
    <div class="sechead">Nuevo lanzamiento</div>
    <div class="row3"><div class="field"><label>Número</label><input class="inp" id="l_num" type="number" placeholder="7"/></div><div class="field" style="grid-column:span 2"><label>Nombre</label><input class="inp" id="l_nom" placeholder="Lanzamiento 7"/></div></div>
    <div class="actions"><button class="btn ghost" id="l_add">+ Crear y activar</button><div class="grow"></div><button class="btn primary" id="l_close">Cerrar</button></div></div>`
  document.body.appendChild(ov);ov.onclick=e=>{if(e.target===ov)ov.remove()};ov.querySelector('#l_close').onclick=()=>ov.remove()
  ov.querySelectorAll('[data-save]').forEach(b=>b.onclick=async()=>{const tr=b.closest('tr'),num=tr.querySelector('.lnum').value,nom=tr.querySelector('.lnom').value.trim()
    const{error}=await sb.from('lanzamientos').update({numero:num!==''?Number(num):null,nombre:nom}).eq('id',b.dataset.save);if(error){toast('Error: '+error.message);return}
    if(state.lanz&&state.lanz.id===b.dataset.save){state.lanz.numero=num!==''?Number(num):null;state.lanz.nombre=nom};toast('Guardado ✓')})
  ov.querySelectorAll('[data-act]').forEach(b=>b.onclick=async()=>{await sb.from('lanzamientos').update({activo:false}).eq('activo',true)
    const{data,error}=await sb.from('lanzamientos').update({activo:true}).eq('id',b.dataset.act).select().single();if(error){toast('Error: '+error.message);return}
    state.lanz=data;toast('Lanzamiento activado ✓');ov.remove();renderEquipo()})
  ov.querySelector('#l_add').onclick=async()=>{const num=document.getElementById('l_num').value,nom=document.getElementById('l_nom').value.trim()||('Lanzamiento '+(num||''))
    await sb.from('lanzamientos').update({activo:false}).eq('activo',true)
    const{data,error}=await sb.from('lanzamientos').insert({numero:num!==''?Number(num):null,nombre:nom,activo:true}).select().single();if(error){toast('Error: '+error.message);return}
    state.lanz=data;toast('Lanzamiento creado ✓');ov.remove();renderEquipo()}}

/* ================= STRIKES ================= */
async function renderStrikes(){const canLog=isMgr()||myProfile.rol==='director'
  view().innerHTML=head('EQUIPO','Strikes')+`
    <div class="card"><h3>Cómo funciona</h3>
      <p class="cdesc">Dos niveles de falta: <b>advertencia</b> (leve) y <b>strike</b> (grave). Cada 3 advertencias se convierten solas en 1 strike. La escalada de comisión no es pareja: pega más fuerte en el segundo tramo, y el tercero ya no es un descuento — es la salida del equipo. Vale para lo que dure el lanzamiento actual; con el próximo, todo arranca de nuevo en cero.</p>
      <div class="tablewrap" style="margin:0"><table><thead><tr><th>Strikes</th><th>Consecuencia</th></tr></thead><tbody>
        <tr><td class="nm">0–2</td><td class="sub2">Sin cambios</td></tr>
        <tr><td class="nm">3</td><td><span class="chip strike">−5% comisión</span></td></tr>
        <tr><td class="nm">6</td><td><span class="chip strike">−15% comisión</span></td></tr>
        <tr><td class="nm">9</td><td><span class="chip vetado">Vetado del equipo</span></td></tr>
      </tbody></table></div>
      <div class="faltas">
        <div class="falta-card">
          <span class="falta-tag">⚠ Advertencia · falta leve</span>
          <h4>Ejemplos</h4>
          <ul>
            <li>No completar los KPIs, o cargarlos incompletos.</li>
            <li>Llegar tarde a una call agendada sin avisar antes.</li>
            <li>No presentarse a las reuniones dailys.</li>
            <li>No completar el contexto de un lead que te corresponde en "Contexto de leads".</li>
          </ul>
        </div>
        <div class="falta-card grave">
          <span class="falta-tag">✕ Strike · falta grave</span>
          <h4>Ejemplos</h4>
          <ul>
            <li>No presentarse a una call agendada sin avisar (no-show propio).</li>
            <li>Maltratar a un lead o faltar el respeto en una llamada.</li>
            <li>Cargar datos falsos o inflados en los KPIs.</li>
            <li>No aplicar las estrategias del lanzamiento bajadas por los directores.</li>
          </ul>
        </div>
      </div>
    </div>
    ${canLog?`<div class="card"><h3>Registrar sanción</h3>
      <div class="row3">
        <div class="field"><label>Persona</label><select id="sk_persona">${state.setters.filter(s=>['setter','closer'].includes(s.rol)).map(s=>`<option value="${s.id}">${esc(s.nombre)} (${s.rol})</option>`).join('')}</select></div>
        <div class="field"><label>Tipo</label><select id="sk_tipo"><option value="advertencia">Advertencia (leve)</option><option value="strike">Strike (grave)</option></select></div>
        <div class="field"><label>Fecha</label><input class="inp" id="sk_fecha" type="date" value="${new Date().toISOString().slice(0,10)}"/></div>
      </div>
      <div class="field"><label>Motivo</label><textarea class="inp" id="sk_motivo" rows="2" placeholder="Qué pasó, en una línea"></textarea></div>
      <div class="actions"><div class="grow"></div><button class="btn primary" id="sk_save">Registrar</button></div>
    </div>`:''}
    <div class="card"><h3>Estado por persona</h3><p class="cdesc">Contando advertencias y strikes del lanzamiento actual.</p>
      <div class="tablewrap" style="margin:0"><table><thead><tr><th>Persona</th><th>Rol</th><th>Advertencias activas</th><th>Strikes</th><th>Estado</th></tr></thead><tbody id="sk_estado"><tr><td colspan="5" class="empty">Cargando…</td></tr></tbody></table></div>
    </div>
    <div class="card"><h3>Historial <span class="sub2" style="font-weight:400">· público, lo ve todo el equipo</span></h3>
      <div class="tablewrap" style="margin:0"><table><thead><tr><th>Fecha</th><th>Persona</th><th>Rol</th><th>Tipo</th><th>Motivo</th><th>Registrado por</th><th>Cargado</th></tr></thead><tbody id="sk_hist"><tr><td colspan="7" class="empty">Cargando…</td></tr></tbody></table></div>
    </div>`
  if(canLog)document.getElementById('sk_save').onclick=saveSancion
  loadStrikes()}
async function saveSancion(){const g=id=>document.getElementById(id)
  const persona_id=g('sk_persona').value,tipo=g('sk_tipo').value,motivo=g('sk_motivo').value.trim(),fecha=g('sk_fecha').value
  if(!persona_id||!motivo){toast('Completá persona y motivo');return}
  const{error}=await sb.from('sanciones').insert({persona_id,tipo,motivo,fecha,lanzamiento_id:state.lanz?state.lanz.id:null,creado_por:me.id})
  if(error){toast('Error: '+error.message);return}
  toast('Registrado ✓');renderStrikes()}
async function loadStrikes(){
  let q=sb.from('sanciones').select('*').order('fecha',{ascending:false}).limit(500)
  if(state.lanz)q=q.eq('lanzamiento_id',state.lanz.id)
  const{data,error}=await q
  const hist=document.getElementById('sk_hist');if(!hist)return
  if(error){hist.innerHTML=`<tr><td colspan="7" class="empty">Error: ${esc(error.message)}</td></tr>`;return}
  const rows=data||[]
  hist.innerHTML=rows.length?rows.map(r=>`<tr><td class="sub2">${esc(r.fecha||'—')}</td><td class="nm">${esc(nameOf(r.persona_id)||'—')}</td><td class="sub2">${esc(rolOf(r.persona_id)||'—')}</td><td><span class="chip ${r.tipo}">${r.tipo}</span></td><td class="sub2">${esc(r.motivo||'')}</td><td class="sub2">${esc(nameOf(r.creado_por)||'—')}</td><td class="sub2">${fmtDateTime(r.created_at)}</td></tr>`).join(''):`<tr><td colspan="7" class="empty">Sin sanciones registradas en este lanzamiento.</td></tr>`
  const agg={}
  rows.forEach(r=>{const a=agg[r.persona_id]=agg[r.persona_id]||{adv:0,strike:0};if(r.tipo==='advertencia')a.adv++;else a.strike++})
  const personas=Object.keys(agg)
  const est=document.getElementById('sk_estado');if(!est)return
  est.innerHTML=personas.length?personas.map(pid=>{const a=agg[pid],advActivas=a.adv%3,strikesEfectivos=a.strike+Math.floor(a.adv/3)
    const chip=strikesEfectivos>=9?'<span class="chip vetado">Vetado</span>':strikesEfectivos>=6?'<span class="chip strike">−15%</span>':strikesEfectivos>=3?'<span class="chip strike">−5%</span>':'<span class="chip leve">sin cambios</span>'
    return `<tr><td class="nm">${esc(nameOf(pid)||'—')}</td><td class="sub2">${esc(rolOf(pid)||'—')}</td><td>${advActivas}</td><td>${strikesEfectivos}</td><td>${chip}</td></tr>`}).join(''):'<tr><td colspan="5" class="empty">Nadie tiene sanciones en este lanzamiento 🎉</td></tr>'}

/* ================= GUÍA ================= */
function renderGuia(){view().innerHTML=head('AYUDA','Guía de uso')+`
<style>

  .guia ol.steps{counter-reset:s;list-style:none;padding:0;margin:12px 0 0}

  .guia ol.steps>li::before{counter-increment:s;content:counter(s);position:absolute;left:0;top:-2px;width:26px;height:26px;border-radius:50%;background:var(--surface-2);border:1px solid var(--line-2);color:var(--accent);font-weight:700;font-size:12px;display:grid;place-items:center;font-family:var(--mono)}
  .guia ol.steps>li:not(:last-child)::after{content:"";position:absolute;left:12.5px;top:26px;bottom:0;width:1px;background:var(--line)}
  .guia ol.steps b{color:var(--ink)}.guia ol.steps .d{color:var(--muted);font-size:13.5px;margin-top:2px}
  .guia .lead2{color:var(--muted);font-size:14px;margin:0 0 4px}
  .guia .flow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0 2px}
  .guia .flow .st{background:var(--surface-2);border:1px solid var(--line-2);border-radius:8px;padding:6px 11px;font-size:13px}.guia .flow .ar{color:var(--faint)}
  .guia .note{background:linear-gradient(180deg,var(--accent-glow),transparent);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:12px;padding:12px 15px;color:var(--muted);font-size:14px;margin:12px 0}.guia .note b{color:var(--ink)}
  .guia .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:680px){.guia .grid2{grid-template-columns:1fr}}
  .guia table{width:100%;border-collapse:collapse;font-size:14px}
  .guia td,.guia th{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
  .guia th{font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
  .guia td b{color:var(--ink)}.guia td .m{color:var(--muted)}
</style>
<div class="guia">
  <p class="lead2">Cómo usar el CRM paso a paso, según tu rol. Si es tu primera vez, empezá por <b style="color:var(--ink)">Arrancar</b> y después andá a la sección de tu rol.</p>
  <div class="toc">
    <a onclick="document.getElementById('g_arr').scrollIntoView({behavior:'smooth'})">Arrancar</a>
    <a onclick="document.getElementById('g_kpi').scrollIntoView({behavior:'smooth'})">KPIs</a>
    <a onclick="document.getElementById('g_str').scrollIntoView({behavior:'smooth'})">Strikes</a>
    <a onclick="document.getElementById('g_ctx').scrollIntoView({behavior:'smooth'})">Contexto de leads</a>
    <a onclick="document.getElementById('g_man').scrollIntoView({behavior:'smooth'})">Manager</a>
    <a onclick="document.getElementById('g_glo').scrollIntoView({behavior:'smooth'})">Glosario</a>
  </div>

  <h2 id="g_arr">1 · Arrancar (todos)</h2>
  <div class="gcard"><ol class="steps">
    <li><b>Entrá al link del CRM</b> y creá tu cuenta con tu email.<div class="d">Primera vez: "Crear una" → email + contraseña + tu nombre.</div></li>
    <li><b>Avisá al manager</b> que te registraste, para que te asigne tu <b>rol</b> en Equipo.</li>
    <li><b>Menú izquierdo</b> = secciones. KPIs es solo para setters; <b>Contexto de leads y Strikes los ve todo el equipo</b>; Equipo es manager-only.</li>
  </ol>
  <div class="note">El CRM hoy es chico a propósito: solo <b>KPIs</b>, <b>Contexto de leads</b> y <b>Strikes</b>. Ya no se trackean agendas ni se cargan ventas acá.</div></div>

  <h2 id="g_kpi">KPIs (setter)</h2>
  <div class="gcard role setter"><span class="tag setter">Setter</span><h3>Tus números, al día</h3>
  <ol class="steps">
    <li><b>KPIs</b> → cargá: sin responder, leves, fluidos, potenciales y agendas.</li>
    <li>Es un <b>solo registro tuyo</b>: cada vez que guardás, pisa tu último número (no se suma a lo anterior) — si cargaste 1 hoy y mañana cargás 2, queda en 2, no en 3.</li>
    <li>El manager ve el historial de todos ordenado por carga, con una alerta si a alguien le suma más en KPIs que leads reales tiene asignados — ahí hay un número mal tipeado, no un bug.</li>
  </ol></div>

  <h2 id="g_str">Strikes</h2>
  <div class="gcard"><h3>Advertencias, strikes y consecuencias</h3>
  <p class="lead2">Página pública — todo el equipo la ve. Sirve para llevar un registro claro de faltas leves y graves durante el lanzamiento.</p>
  <ol class="steps">
    <li>Dos niveles: <b>advertencia</b> (falta leve) y <b>strike</b> (falta grave). Cada <b>3 advertencias se convierten solas en 1 strike</b>.</li>
    <li>Escalada de comisión: <b>3 strikes → −5%</b>, <b>6 strikes → −15%</b>, <b>9 strikes → vetado del equipo</b> por lo que resta del lanzamiento.</li>
    <li>Solo <b>director, manager o admin</b> pueden registrar una sanción: elegís la persona, si es advertencia o strike, la fecha y el motivo. Quién la cargó queda guardado solo, no se elige a mano.</li>
    <li>Todo el equipo ve el <b>Estado por persona</b> (advertencias activas, strikes efectivos y consecuencia actual) y el <b>Historial</b> completo con fecha, motivo y quién la registró.</li>
    <li>El ajuste real del % de comisión o la baja del equipo <b>no lo hace el sistema solo</b> — la página te muestra el estado, pero el manager lo aplica a mano fuera del CRM.</li>
    <li>Todo se resetea a cero con cada lanzamiento nuevo.</li>
  </ol></div>

  <h2 id="g_ctx">Contexto de leads</h2>
  <div class="gcard"><h3>Para setters y closers, sin agenda de por medio</h3>
  <p class="lead2">El CRM ya no se usa para trackear agendas ni cargar ventas — solo KPIs, Strikes y esto. Es el lugar para que un closer que tiene una llamada sin contexto no se quede trabado, y cualquiera lo pueda completar.</p>
  <ol class="steps">
    <li><b>Closer: + Nuevo</b> → cargá lo que tengas: nombre (lo único obligatorio), teléfono, y el asesor si sabés qué setter trabajó a esa persona.</li>
    <li><b>Setter (o cualquiera)</b>: abrí las que digan <span class="chip pendiente">sin contexto</span> y completá Situación actual, Objetivos y Dolores.</li>
    <li>No hace falta que quede "cerrado": tanto el setter como el closer pueden volver a entrar y sumar algo más después de la llamada.</li>
    <li>Usá los filtros <b>Sin contexto / Con contexto</b> para encontrar rápido lo que falta completar.</li>
  </ol></div>

  <h2 id="g_man">Rol Manager</h2>
  <div class="gcard role manager"><span class="tag manager">Manager</span><h3>Configurar y controlar</h3>
  <ol class="steps">
    <li><b>Equipo → Lanzamientos</b>: numerá el actual (ej: N° 7) o creá uno nuevo cuando arranque el siguiente — ahí quedan KPIs y Contexto de leads.</li>
    <li><b>Equipo → Roles</b>: asignale rol a cada persona nueva (setter / closer / director / manager / admin).</li>
    <li>Sos el único que puede <b>editar y borrar</b> registros de KPIs de cualquier asesor (botón "Borrar" en la tabla de Admin).</li>
    <li><b>Strikes</b>: junto con los directores, sos quien registra advertencias y strikes del equipo (ver sección aparte) — el ajuste real de comisión o la baja del equipo lo aplicás vos a mano, fuera del CRM.</li>
  </ol></div>

  <h2 id="g_glo">Glosario</h2>
  <div class="gcard"><table>
    <tr><th>Término</th><th>Qué significa</th></tr>
    <tr><td><b>Lead</b></td><td class="m">Persona interesada que el equipo está trabajando.</td></tr>
    <tr><td><b>Lanzamiento</b></td><td class="m">Período de venta activo (ej: 2.0). KPIs y Contexto de leads quedan agrupados por lanzamiento.</td></tr>
    <tr><td><b>Contexto</b></td><td class="m">Situación, objetivos y dolores de un lead — lo carga quien lo tenga (setter o closer), no solo quien lo creó.</td></tr>
    <tr><td><b>Leve / Fluido / Potencial</b></td><td class="m">Temperatura del lead: leve = sin relación, fluido = ya hay charla real, potencial = interés directo en sumarse.</td></tr>
    <tr><td><b>Asesor</b></td><td class="m">El setter asociado a un lead o ficha de contexto.</td></tr>
    <tr><td><b>Advertencia</b></td><td class="m">Falta leve. Cada 3 se convierten solas en 1 strike.</td></tr>
    <tr><td><b>Strike</b></td><td class="m">Falta grave (o el resultado de acumular 3 advertencias). A los 3 strikes se descuenta comisión; a los 9, vetado del equipo.</td></tr>
  </table></div>
</div>`}
