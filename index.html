<!doctype html><html lang="es"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>NAVE CRM</title>
<style>
  :root{
    --bg:#07080b;--bg-2:#0b0d12;--surface:#0f1219;--surface-2:#141824;--card:#141824;
    --line:#20242f;--line-2:#2a2f3c;--ink:#eef1f6;--muted:#8b93a3;--faint:#5c6472;
    --accent:#46cfe6;--accent-dim:#2b8fa1;--accent-glow:rgba(70,207,230,.16);
    --fluido:#46e0a0;--potencial:#e0b24a;--leve:#7c8698;--danger:#f0654f;--good:#46e0a0;--warn:#e0b24a;
    --mono:ui-monospace,"SF Mono",Menlo,monospace;--sans:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  }
  *{box-sizing:border-box}html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
  button{font-family:inherit;cursor:pointer}a{color:var(--accent)}
  .glow{position:fixed;top:-260px;left:50%;transform:translateX(-30%);width:900px;height:520px;background:radial-gradient(ellipse at center,var(--accent-glow),transparent 62%);pointer-events:none;z-index:0}
  .btn{border:none;border-radius:9px;padding:9px 14px;font-size:13px;font-weight:650}
  .btn.primary{background:var(--accent);color:#04121a}.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line-2)}
  .btn.danger{background:transparent;color:var(--danger);border:1px solid var(--line-2)}.btn:hover{filter:brightness(1.08)}
  .inp,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:9px;color:var(--ink);padding:9px 11px;font-size:13.5px;font-family:inherit;outline:none;width:100%}
  .inp:focus,select:focus,textarea:focus{border-color:var(--accent)}::placeholder{color:var(--faint)}
  .login{position:relative;z-index:1;min-height:100vh;display:grid;place-items:center;padding:20px}
  .login .box{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:34px;width:100%;max-width:400px}
  .login .brand{display:flex;align-items:center;gap:11px;margin-bottom:22px}
  .login h1{font-size:20px;margin:0 0 4px}.login p{color:var(--muted);font-size:13.5px;margin:0 0 20px}
  .login .field{margin-bottom:12px}.login label,.field label{font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:5px}
  .login .err{color:var(--danger);font-size:12.5px;margin-top:10px;min-height:16px}.login .alt{margin-top:14px;text-align:center;font-size:12.5px;color:var(--muted)}
  #app{display:grid;grid-template-columns:236px 1fr;min-height:100vh;position:relative;z-index:1}
  .side{background:var(--bg-2);border-right:1px solid var(--line);display:flex;flex-direction:column}
  .brand{display:flex;align-items:center;gap:10px;padding:20px 18px 16px}.brand svg{width:26px;height:26px}
  .brand .wm b{display:block;font-weight:800;font-size:15px;letter-spacing:.02em}.brand .wm span{font-family:var(--mono);font-size:9px;letter-spacing:.26em;color:var(--muted);text-transform:uppercase}
  .nav{padding:6px 10px;overflow-y:auto;flex:1}.grp{font-family:var(--mono);font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--faint);padding:14px 12px 6px}
  .nav a{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:9px;color:var(--muted);text-decoration:none;font-size:13.5px;margin-bottom:1px;cursor:pointer}
  .nav a .ic{width:16px;height:16px;opacity:.85;flex:none}.nav a:hover{background:var(--surface);color:var(--ink)}
  .nav a.on{background:linear-gradient(90deg,var(--accent-glow),transparent);color:var(--ink);box-shadow:inset 2px 0 0 var(--accent)}
  .me{border-top:1px solid var(--line);padding:12px 16px;display:flex;align-items:center;gap:10px}
  .me .av{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--accent-dim),#5a4bd6);display:grid;place-items:center;font-size:12px;font-weight:700;color:#04121a}
  .me .nm{font-size:12.5px;font-weight:600;line-height:1.2}.me .rl{font-family:var(--mono);font-size:9.5px;color:var(--faint)}.me .out{margin-left:auto;color:var(--faint);background:none;border:none;font-size:16px}
  .main{overflow-y:auto;height:100vh}
  .top{display:flex;align-items:flex-end;gap:16px;padding:26px 30px 14px;flex-wrap:wrap}
  .top h1{margin:0;font-size:27px;font-weight:800;letter-spacing:-.02em}.top .sub{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.04em;margin-bottom:5px}
  .grow{flex:1}
  .funnel{display:grid;grid-template-columns:repeat(5,1fr);gap:16px;padding:10px 30px 24px}
  @media(max-width:1180px){.funnel{grid-template-columns:repeat(3,1fr)}}@media(max-width:720px){.funnel{grid-template-columns:repeat(2,1fr)}}
  .fcell{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px 22px 20px;position:relative;overflow:hidden;min-height:132px}
  .fcell::after{content:"";position:absolute;inset:0;background:radial-gradient(120% 90% at 100% 0,var(--accent-glow),transparent 55%);opacity:.5;pointer-events:none}
  .fcell .ic2{position:absolute;right:18px;top:18px;width:18px;height:18px;color:var(--accent);opacity:.85}
  .fcell .n{font-size:34px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1}
  .fcell .l{font-family:var(--mono);font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-top:10px}
  .fcell .pct{font-family:var(--mono);font-size:11.5px;color:var(--accent);margin-top:12px}
  .fcell .track{height:4px;border-radius:3px;background:var(--surface-2);margin-top:10px;overflow:hidden}.fcell .track>i{display:block;height:100%;background:var(--accent);border-radius:3px}
  .tb{display:flex;gap:9px;align-items:center;padding:4px 30px 14px;flex-wrap:wrap}.search{min-width:230px;max-width:300px}
  .pill{background:var(--surface);border:1px solid var(--line);color:var(--muted);border-radius:20px;padding:7px 13px;font-size:12px;cursor:pointer}.pill.on{border-color:var(--accent);color:var(--ink)}
  select.pill{-webkit-appearance:none;appearance:none;width:auto}
  .tablewrap{margin:0 30px 30px;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface)}
  table{width:100%;border-collapse:collapse;font-size:13px}
  thead th{text-align:left;font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);font-weight:600;padding:12px 14px;border-bottom:1px solid var(--line);background:var(--bg-2)}
  tbody td{padding:15px 16px;border-bottom:1px solid var(--line);color:var(--muted);vertical-align:middle}tbody tr:last-child td{border-bottom:none}tbody tr.clk:hover{background:var(--surface-2);cursor:pointer}
  .nm{color:var(--ink);font-weight:600}.sub2{font-size:11.5px;color:var(--faint)}
  .chip{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;padding:3px 8px;border-radius:20px}
  .chip.fluido{color:var(--fluido);background:rgba(70,224,160,.12)}.chip.potencial{color:var(--potencial);background:rgba(224,178,74,.12)}.chip.leve{color:var(--leve);background:rgba(124,134,152,.14)}
  .chip.pendiente{color:var(--warn);background:rgba(224,178,74,.12)}.chip.cobrado{color:var(--good);background:rgba(70,224,160,.12)}.chip.vencido{color:var(--danger);background:rgba(240,101,79,.12)}
  .estado{display:inline-flex;align-items:center;gap:7px;color:var(--ink);font-size:12.5px}.dot{width:7px;height:7px;border-radius:50%;background:var(--accent)}
  .who{display:inline-flex;align-items:center;gap:7px}.who .a{width:22px;height:22px;border-radius:50%;background:#222838;display:grid;place-items:center;font-size:10px;color:var(--ink);font-weight:700}
  .foot{display:flex;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid var(--line);color:var(--faint);font-family:var(--mono);font-size:11px}
  .pg{background:var(--surface-2);border:1px solid var(--line-2);border-radius:7px;color:var(--muted);padding:5px 10px;cursor:pointer;font-family:var(--mono);font-size:11px}.pg[disabled]{opacity:.4;cursor:default}
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;z-index:60;overflow-y:auto}
  .modal{background:var(--surface);border:1px solid var(--line);border-radius:18px;width:100%;max-width:540px;padding:22px;position:relative;z-index:61}.modal h2{margin:0 0 16px;font-size:18px}
  .field{margin-bottom:13px}.row2{display:grid;grid-template-columns:1fr 1fr;gap:11px}.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:11px}@media(max-width:640px){.row2,.row3{grid-template-columns:1fr}}
  .actions{display:flex;gap:9px;margin-top:8px;align-items:center}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px;margin:0 30px 20px}
  .card h3{margin:0 0 4px;font-size:16px}.card .cdesc{color:var(--muted);font-size:13px;margin:0 0 16px}
  .sechead{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin:6px 0 12px}
  .tabs{display:flex;gap:6px;padding:0 30px 14px}.tab{background:var(--surface);border:1px solid var(--line);color:var(--muted);border-radius:9px;padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer}.tab.on{background:var(--surface-2);color:var(--ink);border-color:var(--accent)}
  .attend{display:flex;gap:8px}.clbtn{flex:1;padding:9px;border-radius:9px;border:1px solid var(--line-2);background:var(--surface);color:var(--muted);font-size:12.5px;cursor:pointer}.clbtn.yes{background:rgba(70,207,230,.15);border-color:var(--accent-dim);color:var(--accent)}
  .bars{display:flex;align-items:flex-end;gap:18px;height:180px;padding:16px 6px 0}.bar{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;justify-content:flex-end;height:100%}
  .bar .col{width:60%;max-width:64px;background:linear-gradient(180deg,var(--accent),var(--accent-dim));border-radius:8px 8px 0 0;min-height:3px}.bar .bl{font-size:12px;color:var(--muted)}.bar .bn{font-family:var(--mono);font-size:12px;color:var(--ink)}
  .agenda .day{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin:16px 0 8px}
  .ev{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:12px 14px;margin-bottom:8px}
  .ev .tg{font-family:var(--mono);font-size:10px;color:var(--faint);text-transform:uppercase;border:1px solid var(--line-2);border-radius:6px;padding:2px 7px}
  .stub{margin:40px 30px;padding:50px 30px;border:1px dashed var(--line-2);border-radius:16px;text-align:center;color:var(--faint)}.stub b{color:var(--ink);display:block;font-size:16px;margin-bottom:6px}
  .empty{padding:44px;text-align:center;color:var(--faint);font-size:14px}
  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--surface-2);border:1px solid var(--line-2);color:var(--ink);padding:11px 18px;border-radius:11px;font-size:13px;z-index:90;opacity:0;transition:opacity .2s}.toast.show{opacity:1}
  .mapgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;align-items:center;margin:6px 0 14px}.mapgrid .csvcol{font-size:13px;color:var(--ink);font-family:var(--mono)}
  .split{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin:0 30px 20px}@media(max-width:900px){.split{grid-template-columns:1fr}}
  .listrow{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}.listrow:last-child{border:none}
</style></head>
<body>
<div class="glow"></div><div id="root"></div><div id="toast" class="toast"></div>
<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2'
/* ===== CONFIG — completá antes de deployar (Supabase → Settings → API) ===== */
const SUPABASE_URL = 'https://mnsbmrzeltolhkzdbaop.supabase.co'
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1uc2JtcnplbHRvbGhremRiYW9wIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU5NTEyODcsImV4cCI6MjEwMTUyNzI4N30.Zb0JD1dx2xiqmc_-mvtOU6dYhtjV8MYq7tbLg8r1Wgg'

const ROCKET=`<svg viewBox="0 0 48 48" fill="none"><g fill="currentColor"><path d="M20.4 8.6 L32.6 20.4 Q27.4 20 25.7 22.2 Q24.4 23.9 24 26.6 Q23.1 22.6 20.4 21.4 Q17.7 20.2 14 20.8 Z"/><path d="M24 26.4 C31.6 33.4 29.4 42.2 14.6 43.4 C23.8 40 25.2 31.6 21.8 27.6 Z"/></g></svg>`
const ESTADOS=['Nuevo','Contactado','Confirmó clase','Asistió','Agendó','Cerrado','Perdido']
const TEMPS=['fluido','potencial','leve'];const MONEDAS=['USD','ARS','EUR'];const FORMAS=['Un pago','2 cuotas','3 cuotas'];const PAGE=50
const root=document.getElementById('root')
let sb=null,me=null,myProfile=null
let state={page:0,q:'',temp:'',estado:'',mine:false,total:0,leads:[],setters:[],lanz:null,clases:[]}
const esc=s=>(s??'').toString().replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))
const initials=n=>(n||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase()
const isMgr=()=>myProfile&&(myProfile.rol==='manager'||myProfile.rol==='admin')
const money=n=>'US$ '+(Number(n||0)).toLocaleString('es',{minimumFractionDigits:2,maximumFractionDigits:2})
const fmtCur=(n,mon)=>(mon||'USD')+' '+(Number(n||0)).toLocaleString('es',{minimumFractionDigits:2,maximumFractionDigits:2})
const num=n=>(Number(n||0)).toLocaleString('es')
const nameOf=id=>{const s=state.setters.find(x=>x.id===id);return s?s.nombre:null}
const CANALES=[['lanzamiento','Lanzamiento'],['funnel','Funnel'],['referido','Referido']]
const EQUIPOS=[['','— sin equipo —'],['nexus','Nexus'],['puente','Puente']]
const equipoLabel=e=>e==='nexus'?'Nexus':e==='puente'?'Puente':'—'
const directorDe=eq=>eq?state.setters.find(p=>p.rol==='director'&&p.equipo===eq):null
function srcVentas(q,val){if(!val||val==='all')return q;if(val==='funnel'||val==='referido')return q.eq('canal',val);return q.eq('lanzamiento_id',val)}
function srcEmbed(q,val){if(!val||val==='all')return q;if(val==='funnel'||val==='referido')return q.eq('ventas.canal',val);return q.eq('ventas.lanzamiento_id',val)}
function srcOptions(sel,lanzs){return `<option value="all" ${sel==='all'?'selected':''}>Todos</option>`+(lanzs||[]).map(l=>`<option value="${l.id}" ${sel===l.id?'selected':''}>${lanzLabel(l)}</option>`).join('')+`<option value="funnel" ${sel==='funnel'?'selected':''}>Funnel</option><option value="referido" ${sel==='referido'?'selected':''}>Referidos</option>`}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1900)}
function fmtDate(s){if(!s)return'—';const d=new Date(s),n=new Date();if(d.toDateString()===n.toDateString())return'hoy '+d.toLocaleTimeString('es',{hour:'2-digit',minute:'2-digit'});return d.toLocaleDateString('es',{day:'2-digit',month:'2-digit'})}
function view(){return document.getElementById('view')}

/* ---------- BOOT ---------- */
function renderError(e){root.innerHTML=`<div class="login"><div class="box"><div class="brand">${ROCKET}<div class="wm"><b>NAVE</b><span>Instituto · CRM</span></div></div><h1>Ups, algo falló al cargar</h1><p>${esc((e&&e.message)||e||'Error desconocido')}</p><button class="btn primary" style="width:100%" onclick="location.reload()">Reintentar</button><div class="alt"><a onclick="(async()=>{await sb.auth.signOut();location.reload()})()">Cerrar sesión y volver a entrar</a></div></div></div>`}
window.addEventListener('error',ev=>console.error('window error',ev.error||ev.message))
function renderConfigNeeded(){root.innerHTML=`<div class="login"><div class="box"><div class="brand">${ROCKET}<div class="wm"><b>NAVE</b><span>Instituto · CRM</span></div></div><h1>Falta conectar Supabase</h1><p>Completá <code>SUPABASE_URL</code> y <code>SUPABASE_ANON_KEY</code> arriba de <code>index.html</code> (Supabase → Settings → API) y volvé a deployar. El SQL está en <code>schema.sql</code>.</p></div></div>`}

/* ---------- AUTH ---------- */
function renderLogin(){
  root.innerHTML=`<div class="login"><div class="box"><div class="brand">${ROCKET}<div class="wm"><b>NAVE</b><span>Instituto · CRM</span></div></div>
    <h1 id="lt">Ingresá</h1><p id="ls">Accedé con tu cuenta del equipo.</p>
    <div class="field"><label>Email</label><input class="inp" id="le" type="email" placeholder="vos@nave.com"/></div>
    <div class="field"><label>Contraseña</label><input class="inp" id="lp" type="password" placeholder="••••••••"/></div>
    <div class="field" id="lnw" style="display:none"><label>Tu nombre</label><input class="inp" id="ln" placeholder="Nombre y apellido"/></div>
    <button class="btn primary" id="lb" style="width:100%;margin-top:6px">Entrar</button><div class="err" id="lerr"></div>
    <div class="alt">¿No tenés cuenta? <a id="ltg">Crear una</a></div></div></div>`
  let m='in';const $=id=>document.getElementById(id)
  $('ltg').onclick=()=>{m=m==='in'?'up':'in';$('lt').textContent=m==='in'?'Ingresá':'Crear cuenta';$('lnw').style.display=m==='in'?'none':'block';$('lb').textContent=m==='in'?'Entrar':'Crear cuenta';$('ltg').textContent=m==='in'?'Crear una':'Ya tengo cuenta'}
  $('lb').onclick=async()=>{const email=$('le').value.trim(),pass=$('lp').value,err=$('lerr');err.textContent=''
    if(!email||!pass){err.textContent='Completá email y contraseña.';return}$('lb').textContent='...'
    let r=m==='up'?await sb.auth.signUp({email,password:pass,options:{data:{nombre:$('ln').value.trim()}}}):await sb.auth.signInWithPassword({email,password:pass})
    if(r.error){err.textContent=r.error.message;$('lb').textContent=m==='in'?'Entrar':'Crear cuenta';return}
    if(r.data.session)await afterLogin(r.data.session);else err.textContent='Revisá tu email para confirmar la cuenta.'}
}
async function afterLogin(session){me=session.user
  try{const{data:prof}=await sb.from('profiles').select('*').eq('id',me.id).maybeSingle();if(prof)myProfile=prof}catch(e){console.error('profile',e)}
  if(!myProfile)myProfile={nombre:(me.email||'Usuario'),rol:'setter'}
  try{await ensureLanzamiento()}catch(e){console.error('lanz',e)}
  try{await ensureClases()}catch(e){console.error('clases',e)}
  try{const{data:setters}=await sb.from('profiles').select('id,nombre,rol,equipo,com_setter_pct,com_closer_pct,com_director_pct').eq('activo',true);state.setters=setters||[]}catch(e){console.error('setters',e)}
  if(!location.hash||location.hash==='#')location.hash='#/panel'
  renderShell();route()}
async function ensureLanzamiento(){let{data}=await sb.from('lanzamientos').select('*').eq('activo',true).order('created_at',{ascending:false}).limit(1)
  if(data&&data[0]){state.lanz=data[0];return}
  if(isMgr()){const{data:n}=await sb.from('lanzamientos').insert({nombre:'Lanzamiento actual',activo:true}).select().single();state.lanz=n}}
async function ensureClases(){if(!state.lanz)return
  let{data}=await sb.from('clases').select('*').eq('lanzamiento_id',state.lanz.id).order('numero')
  if((!data||!data.length)&&isMgr()){await sb.from('clases').insert([1,2,3].map(nu=>({lanzamiento_id:state.lanz.id,numero:nu,titulo:'Clase '+nu})));const r=await sb.from('clases').select('*').eq('lanzamiento_id',state.lanz.id).order('numero');data=r.data}
  state.clases=data||[]}

/* ---------- SHELL + ROUTER ---------- */
const NAV=[
  {g:null,items:[['#/panel','Panel general'],['#/calendario','Calendario'],['#/guia','Guía']]},
  {g:'Setter',items:[['#/leads','Leads'],['#/nuevo','Nuevo lead'],['#/importar','Cargar agenda'],['#/kpis','KPIs diarios']]},
  {g:'Closer',items:[['#/triage','Triage'],['#/reporte','Reporte de llamadas'],['#/grilla','Grilla de reportes']]},
  {g:'Ventas',items:[['#/ventas','Ventas'],['#/senas','Señas']]},
  {g:'Marketing',items:[['#/marketing','Rendimiento de contenido']]},
  {g:'Cobros',items:[['#/cobros','Cuotas y seguimientos'],['#/facturacion','Facturación'],['#/comisiones','Comisiones']]}]
function renderShell(){
  const nav=NAV.map(s=>`${s.g?`<div class="grp">${s.g}</div>`:''}${s.items.map(([h,l])=>`<a data-h="${h}"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="9"/></svg><span>${l}</span></a>`).join('')}`).join('')

async function loadFunnel(){const el=document.getElementById('funnel');if(!el)return
  const{count:total}=await sb.from('leads').select('*',{count:'exact',head:true})
  const ci=async es=>{const{count}=await sb.from('leads').select('*',{count:'exact',head:true}).in('estado',es);return count||0}
  const conf=await ci(['Confirmó clase','Asistió','Agendó','Cerrado']),asis=await ci(['Asistió','Agendó','Cerrado']),agen=await ci(['Agendó','Cerrado']),cerr=await ci(['Cerrado'])
  const t=total||0,pc=n=>t?((n/t*100).toFixed(1).replace('.',',')+'%'):'0%',w=n=>t?Math.round(n/t*100):0
  const cells=[['Leads totales',t,'100%',100],['Confirmaron clase',conf,pc(conf),w(conf)],['Asistieron',asis,pc(asis),w(asis)],['Agendaron call',agen,pc(agen),w(agen)],['Cerraron',cerr,pc(cerr),w(cerr)]]
  el.innerHTML=cells.map(([l,n,p,wd])=>`<div class="fcell"><svg class="ic2" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="9"/></svg><div class="n">${num(n)}</div><div class="l">${l}</div><div class="pct">${p}</div><div class="track"><i style="width:${wd}%"></i></div></div>`).join('')}
async function cobrosResumen(){const today=new Date().toISOString().slice(0,10)
  // Devuelve un objeto por moneda — cada moneda se trackea por separado, sin conversión a USD.
  const{data}=await sb.from('cuotas').select('monto,moneda,estado,vencimiento,origen,venta_id').limit(10000)
  const M={},slot=m=>M[m]=M[m]||{cobrado:0,aldia:0,vencidas:0,total:0,upsell:0,senas:0}
  const ventasConCobro=new Set()
  ;(data||[]).forEach(c=>{const mon=c.moneda||'USD',a=slot(mon),m=Number(c.monto||0);a.total+=m
    if(c.estado==='cobrado'){a.cobrado+=m;if(c.venta_id)ventasConCobro.add(c.venta_id);if(['upsell','resell'].includes(c.origen))a.upsell+=m}
    else if(c.estado==='vencido'||(c.vencimiento&&c.vencimiento<today))a.vencidas+=m;else a.aldia+=m})
  // señas: suman al cash collected sólo si su venta ya cobró al menos una cuota
  const{data:sn}=await sb.from('senas').select('monto,moneda,venta_id,estado').eq('estado','aplicada').limit(10000)
  ;(sn||[]).forEach(s=>{if(s.venta_id&&ventasConCobro.has(s.venta_id)){const mon=s.moneda||'USD',a=slot(mon),m=Number(s.monto||0);a.senas+=m;a.cobrado+=m}})
  return M}

async function uploadComprobante(file){if(!file)return null
  const ext=(file.name.split('.').pop()||'bin').toLowerCase(),rnd=Math.random().toString(36).slice(2,8)
  const path=`${(state.lanz&&state.lanz.id)||'na'}/${Date.now()}-${rnd}.${ext}`
  const{error}=await sb.storage.from('comprobantes').upload(path,file,{upsert:false,contentType:file.type||undefined})
  if(error)throw error
  return sb.storage.from('comprobantes').getPublicUrl(path).data.publicUrl}

async function saveVenta(v){const rate=1 // cada moneda se trackea por separado, sin conversión

  const venta={lanzamiento_id:lanzId,canal,equipo:v.equipo||null,lead_id:v.leadId||null,cliente:v.cliente||null,closer_id:closerId,setter_id:setterId,com_setter_pct,com_closer_pct,reporte_id:v.reporteId||null,programa:v.programa||null,moneda:v.moneda,cotizacion:rate,ticket:v.ticket,base_comisionable:(Number(v.baseComision)>0?Number(v.baseComision):v.ticket),pagado:v.pago,a_cobrar:v.cobrar,forma_pago:v.forma,billetera:v.billetera||null,comprobante_url,origen}

    const{data:os}=await sb.from('senas').select('id').eq('venta_id',v.editId)

    if(oldIds.length)await sb.from('comision_pagos').delete().in('origen_id',oldIds)
    await sb.from('cuotas').delete().eq('venta_id',v.editId)
    await sb.from('senas').update({estado:'registrada',venta_id:null}).eq('venta_id',v.editId)
    const{error}=await sb.from('ventas').update(venta).eq('id',v.editId);if(error)throw error
  }else{const{data:vrow,error}=await sb.from('ventas').insert(venta).select().single();if(error)throw error;ventaId=vrow.id}
  const cuotas=[]
  if(v.pago>0)cuotas.push({venta_id:ventaId,lead_id:v.leadId||null,programa:v.programa,moneda:v.moneda,monto:v.pago,monto_usd:v.pago/(rate||1),estado:'cobrado',origen,billetera:v.billetera,comprobante_url,cobrado_at:new Date().toISOString(),vencimiento:new Date().toISOString().slice(0,10)})
  ;(v.cuotas||[]).forEach(c=>cuotas.push({venta_id:ventaId,lead_id:v.leadId||null,programa:v.programa,moneda:v.moneda,monto:c.monto,monto_usd:c.monto/(rate||1),estado:'pendiente',origen,billetera:v.billetera,vencimiento:c.vencimiento}))
  if(cuotas.length){const{error:ce}=await sb.from('cuotas').insert(cuotas);if(ce)throw ce}
  if(v.sena)await sb.from('senas').update({venta_id:ventaId,estado:'aplicada'}).eq('id',v.sena)
  if(v.leadId)await sb.from('leads').update({estado:'Cerrado'}).eq('id',v.leadId)
  return{id:ventaId}}

/* ================= FACTURACIÓN ================= */
async function renderFacturacion(){
  const{data:lanzs}=await sb.from('lanzamientos').select('id,numero,nombre').order('numero',{ascending:true,nullsFirst:false})
  if(facLanzFilter===null)facLanzFilter=(state.lanz&&state.lanz.id)||'all'
  view().innerHTML=head('FACTURACIÓN','Facturación y cash collected',`<select class="pill" id="fc_lanz">${srcOptions(facLanzFilter,lanzs)}</select>`)+`<div class="funnel" id="fk"></div><div id="facBody"><div class="empty" style="padding:24px">Cargando…</div></div>`
  document.getElementById('fc_lanz').onchange=e=>{facLanzFilter=e.target.value;renderFacturacion()}
  // Cada moneda se trackea por separado, sin conversión — nada de cotización acá.
  let vq=srcVentas(sb.from('ventas').select('id,moneda,ticket'),facLanzFilter)
  const{data:ventas,error}=await vq
  if(error){document.getElementById('facBody').innerHTML=`<div class="empty" style="padding:24px">Error: ${esc(error.message)}</div>`;return}
  let cq=srcEmbed(sb.from('cuotas').select('monto,estado,moneda,billetera,venta_id,ventas!inner(lanzamiento_id,canal)'),facLanzFilter)
  const{data:cuotas}=await cq
  let sq=srcEmbed(sb.from('senas').select('monto,moneda,billetera,venta_id,ventas!inner(lanzamiento_id,canal)').eq('estado','aplicada'),facLanzFilter)
  const{data:senas}=await sq
  // acumular por moneda
  const M={} // moneda -> {fact,cash,pend}
  const slot=m=>M[m]=M[m]||{fact:0,cash:0,pend:0}
  const W={} // billetera -> {moneda: monto}
  const addW=(b,mon,amt)=>{const k=(b&&b.trim())||'(sin especificar)',w=W[k]=W[k]||{},c=mon||'USD';w[c]=(w[c]||0)+Number(amt||0)}
  ;(ventas||[]).forEach(v=>{const m=v.moneda||'USD',a=slot(m);a.fact+=Number(v.ticket||0)})
  const ventasConCobro=new Set()
  ;(cuotas||[]).forEach(c=>{const m=c.moneda||'USD',a=slot(m)
    if(c.estado==='cobrado'){if(c.venta_id)ventasConCobro.add(c.venta_id);a.cash+=Number(c.monto||0);addW(c.billetera,c.moneda,c.monto)}
    else{a.pend+=Number(c.monto||0)}})
  ;(senas||[]).forEach(s=>{if(!s.venta_id||!ventasConCobro.has(s.venta_id))return;const m=s.moneda||'USD',a=slot(m);a.cash+=Number(s.monto||0);addW(s.billetera,s.moneda,s.monto)})
  const orden=['ARS','USD','EUR'].filter(m=>M[m]).concat(Object.keys(M).filter(m=>!['ARS','USD','EUR'].includes(m)))
  document.getElementById('fk').innerHTML=orden.length?orden.map(mon=>{const a=M[mon]
    return[['Facturación',a.fact],['Cash collected',a.cash],['Por cobrar',a.pend]].map(([l,n])=>`<div class="fcell"><div class="n" style="font-size:20px">${fmtCur(n,mon)}</div><div class="l">${mon} · ${l}</div></div>`).join('')}).join(''):`<div class="fcell"><div class="n" style="font-size:24px">—</div><div class="l">Sin ventas</div></div>`
  const rowsCur=(mon,a)=>`<div class="card" style="margin:0 30px 16px"><h3>Ventas en ${mon}</h3>
    <div class="listrow"><span style="flex:1" class="sub2">Facturación (ticket total)</span><span class="nm">${fmtCur(a.fact,mon)}</span></div>
    <div class="listrow"><span style="flex:1" class="sub2">Cash collected</span><span class="nm">${fmtCur(a.cash,mon)}</span></div>
    <div class="listrow"><span style="flex:1" class="sub2">Por cobrar</span><span class="nm">${fmtCur(a.pend,mon)}</span></div></div>`
  const cards=orden.length?orden.map(m=>rowsCur(m,M[m])).join(''):`<div class="empty" style="padding:24px">Sin ventas cargadas todavía.</div>`
  const curOrd=o=>['ARS','USD','EUR'].filter(m=>o[m]!=null).concat(Object.keys(o).filter(m=>!['ARS','USD','EUR'].includes(m)))
  const wl=Object.keys(W).sort()
  const wallets=`<div class="card" style="margin:0 30px 24px"><h3>Cash por billetera</h3><p class="cdesc">Cash collected por medio de cobro (incluye señas activadas), desglosado por moneda.</p>${wl.length?wl.map(w=>{const parts=curOrd(W[w]).map(m=>fmtCur(W[w][m],m)).join('  ·  ')
    return `<div class="listrow"><span style="flex:1"><span class="sub2">${esc(w)}</span></span><span class="nm">${parts}</span></div>`}).join(''):'<div class="empty" style="padding:12px">Sin cobros todavía.</div>'}</div>`
  document.getElementById('facBody').innerHTML=cards+wallets}

/* ================= COMISIONES ================= */
let comLanzFilter=null,COM_LINES=[],COM_PAID=new Set(),MANUAL_PAG={},facLanzFilter=null,ventasSrc='all'
const lanzLabel=l=>(l.numero!=null?('N° '+l.numero+' · '):'')+esc(l.nombre||'Lanzamiento')
async function renderComisiones(){
  const{data:lanzs}=await sb.from('lanzamientos').select('id,numero,nombre').order('numero',{ascending:true,nullsFirst:false})
  if(comLanzFilter===null)comLanzFilter=(state.lanz&&state.lanz.id)||'all'
  const actions=`<select class="pill" id="cm_lanz" style="margin-right:8px">${srcOptions(comLanzFilter,lanzs)}</select>${isMgr()?'<button class="btn ghost" id="cm_lanzmgr">Lanzamientos</button>':''}`
  view().innerHTML=head('COMISIONES','Comisiones',actions)+`<div id="cfgWrap"></div><div class="funnel" id="ck"></div><div id="comResumen"></div>
    <div class="split">
      <div class="card" style="margin:0"><h3>Setters</h3><p class="cdesc">Comisión por el lead trabajado / agendado.</p><div id="setTbl"><div class="empty" style="padding:24px">Cargando…</div></div></div>
      <div class="card" style="margin:0"><h3>Closers</h3><p class="cdesc">Comisión por la venta cerrada.</p><div id="cloTbl"><div class="empty" style="padding:24px">Cargando…</div></div></div>
    </div>
    <div class="card" style="margin:0 30px 16px"><h3>Directores comerciales</h3><p class="cdesc">Comisión sobre la facturación total (ticket) de las ventas de su equipo — sin topes.</p><div id="dirTbl"><div class="empty" style="padding:24px">Cargando…</div></div></div>
    <p class="cdesc" style="margin:0 30px 24px">La comisión se genera sobre la plata efectivamente cobrada (cuotas en estado cobrado). Cada venta congela el % del momento.</p>`
  document.getElementById('cm_lanz').onchange=e=>{comLanzFilter=e.target.value;renderComisiones()}
  const nb=document.getElementById('cm_lanzmgr');if(nb)nb.onclick=openLanzModal
  if(isMgr())renderComConfig()
  renderComResumen()
  // Cada moneda se trackea por separado, sin conversión — nada de cotización acá.
  let vq=sb.from('ventas').select('id,cliente,lead_id,leads(nombre),setter_id,closer_id,com_setter_pct,com_closer_pct,lanzamiento_id,moneda,base_comisionable,ticket,equipo')
  vq=srcVentas(vq,comLanzFilter)
  const{data:ventas,error:ve}=await vq
  if(ve){document.getElementById('setTbl').innerHTML=`<div class="empty" style="padding:24px">Error: ${esc(ve.message)}</div>`;return}
  const vmap={};(ventas||[]).forEach(v=>vmap[v.id]=v)
  let q=sb.from('cuotas').select('id,monto,venta_id,ventas!inner(lanzamiento_id,canal)').eq('estado','cobrado').limit(10000)
  q=srcEmbed(q,comLanzFilter)
  const{data:cuotas}=await q
  let sq=sb.from('senas').select('id,monto,venta_id,ventas!inner(lanzamiento_id,canal)').eq('estado','aplicada').limit(10000)
  sq=srcEmbed(sq,comLanzFilter)
  const{data:senas}=await sq
  const{data:pagos}=await sb.from('comision_pagos').select('origen_tipo,origen_id,rol').limit(20000)
  const paid=new Set((pagos||[]).map(p=>p.origen_tipo+':'+p.origen_id+':'+p.rol))
  const{data:manuales}=await sb.from('pagos_manuales').select('persona_id,rol,moneda,monto_usd').limit(20000)
  const manualAgg={};(manuales||[]).forEach(m=>{const k=m.persona_id+':'+m.rol+':'+(m.moneda||'USD');manualAgg[k]=(manualAgg[k]||0)+Number(m.monto_usd||0)})
  MANUAL_PAG=manualAgg
  const lines=[],ventasConCobro=new Set()
  const push=(tipo,id,comBase,v)=>{const label=(v.leads&&v.leads.nombre)||v.cliente||'—',moneda=v.moneda||'USD'
    if(v.setter_id)lines.push({tipo,id,ventaId:v.id,rol:'setter',personaId:v.setter_id,moneda,base:comBase,pct:Number(v.com_setter_pct||0),monto:comBase*Number(v.com_setter_pct||0)/100,label,lanzId:v.lanzamiento_id})
    if(v.closer_id)lines.push({tipo,id,ventaId:v.id,rol:'closer',personaId:v.closer_id,moneda,base:comBase,pct:Number(v.com_closer_pct||0),monto:comBase*Number(v.com_closer_pct||0)/100,label,lanzId:v.lanzamiento_id})}
  const byV={}
  ;(cuotas||[]).forEach(c=>{const v=vmap[c.venta_id];if(!v)return;ventasConCobro.add(c.venta_id);(byV[c.venta_id]=byV[c.venta_id]||[]).push({tipo:'cuota',id:c.id,monto:Number(c.monto||0)})})
  ;(senas||[]).forEach(s=>{const v=vmap[s.venta_id];if(!v||!ventasConCobro.has(s.venta_id))return;(byV[s.venta_id]=byV[s.venta_id]||[]).push({tipo:'sena',id:s.id,monto:Number(s.monto||0)})})
  Object.keys(byV).forEach(vid=>{const v=vmap[vid],cap=(v.base_comisionable!=null&&Number(v.base_comisionable)>0)?Number(v.base_comisionable):Infinity;let cum=0
    byV[vid].forEach(ev=>{const prev=Math.min(cum,cap);cum+=ev.monto;const now=Math.min(cum,cap);push(ev.tipo,ev.id,Math.max(0,now-prev),v)})})
  // comisión de director: sobre la facturación completa (ticket) de las ventas de su equipo, SIN topes
  ;(ventas||[]).forEach(v=>{const dir=directorDe(v.equipo);if(!dir||!(Number(dir.com_director_pct)>0))return
    const base=Number(v.ticket||0),pct=Number(dir.com_director_pct)||0,moneda=v.moneda||'USD'
    lines.push({tipo:'venta',id:v.id,ventaId:v.id,rol:'director',personaId:dir.id,moneda,base,pct,monto:base*pct/100,label:(v.leads&&v.leads.nombre)||v.cliente||'—',lanzId:v.lanzamiento_id})})
  COM_LINES=lines;COM_PAID=paid
  const roleAgg=rol=>{const o={};lines.filter(l=>l.rol===rol).forEach(l=>{const k=l.personaId+':'+l.moneda,a=o[k]=o[k]||{dev:0,pag:0,personaId:l.personaId,moneda:l.moneda};a.dev+=l.monto;if(paid.has(l.tipo+':'+l.id+':'+l.rol))a.pag+=l.monto})
    Object.keys(o).forEach(k=>{o[k].pag+=Number(manualAgg[o[k].personaId+':'+rol+':'+o[k].moneda]||0)});return o}
  const setAgg=roleAgg('setter'),cloAgg=roleAgg('closer'),dirAgg=roleAgg('director')
  // totales por moneda (nunca se suman entre monedas)
  const totByMon={}
  ;[setAgg,cloAgg,dirAgg].forEach(o=>Object.values(o).forEach(x=>{const t=totByMon[x.moneda]=totByMon[x.moneda]||{dev:0,pag:0};t.dev+=x.dev;t.pag+=x.pag}))
  const monOrd=['USD','ARS','EUR'].filter(m=>totByMon[m]).concat(Object.keys(totByMon).filter(m=>!['USD','ARS','EUR'].includes(m)))
  document.getElementById('ck').innerHTML=monOrd.length?monOrd.map(mon=>{const t=totByMon[mon]
    return[['Ganado',t.dev],['Pagado',t.pag],['Pendiente',t.dev-t.pag]].map(([l,n])=>`<div class="fcell"><div class="n" style="font-size:20px">${fmtCur(n,mon)}</div><div class="l">${mon} · ${l}</div></div>`).join('')}).join(''):`<div class="fcell"><div class="n" style="font-size:24px">—</div><div class="l">Sin comisiones</div></div>`
  const tbl=(o,rol)=>{const list=Object.values(o).map(x=>{const p=state.setters.find(y=>y.id===x.personaId);return{id:x.personaId,moneda:x.moneda,nombre:(p&&p.nombre)||'—',dev:x.dev,pag:x.pag,pend:x.dev-x.pag}}).filter(r=>r.dev>0.005).sort((a,b)=>b.pend-a.pend)
    return list.length?`<div class="tablewrap" style="margin:0"><table><thead><tr><th>Persona</th><th>Moneda</th><th>Ganado</th><th>Pagado</th><th>Pend.</th><th></th></tr></thead><tbody>${list.map(r=>`<tr><td><span class="nm" data-det="${rol}|${r.id}|${r.moneda}" style="cursor:pointer;border-bottom:1px dotted var(--faint)">${esc(r.nombre)}</span></td><td class="sub2">${r.moneda}</td><td>${fmtCur(r.dev,r.moneda)}</td><td>${fmtCur(r.pag,r.moneda)}</td><td class="nm" style="color:${r.pend>0.001?'var(--warn)':'var(--good)'}">${fmtCur(r.pend,r.moneda)}</td><td><button class="pg" data-det="${rol}|${r.id}|${r.moneda}">ver ventas</button></td></tr>`).join('')}</tbody></table></div>`:`<div class="empty" style="padding:24px">Sin comisiones en este lanzamiento.</div>`}
  document.getElementById('setTbl').innerHTML=tbl(setAgg,'setter')
  document.getElementById('cloTbl').innerHTML=tbl(cloAgg,'closer')
  document.getElementById('dirTbl').innerHTML=tbl(dirAgg,'director')
  document.querySelectorAll('[data-det]').forEach(b=>b.onclick=()=>{const parts=b.dataset.det.split('|');openComDetalle(parts[0],parts[1],parts[2])})}
async function openComDetalle(rol,personaId,moneda){
  const p=state.setters.find(x=>x.id===personaId),nombre=(p&&p.nombre)||'—'
  const mine=COM_LINES.filter(l=>l.rol===rol&&l.personaId===personaId&&l.moneda===moneda&&l.monto>0.005)
  const ov=document.createElement('div');ov.className='overlay';let changed=false
  let{data:manuals}=await sb.from('pagos_manuales').select('*').eq('persona_id',personaId).eq('rol',rol).eq('moneda',moneda).order('pagado_at',{ascending:false})
  manuals=manuals||[]
  const keyOf=l=>l.tipo+':'+l.id+':'+l.rol
  const groups=()=>{const g={},ord=[];mine.forEach((l,i)=>{const k=String(l.ventaId);if(!g[k]){g[k]={label:l.label,items:[]};ord.push(k)}g[k].items.push({l,i})});return{g,ord}}
  const body=()=>{const{g,ord}=groups();if(!ord.length)return ''
    return ord.map(k=>{const grp=g[k],sub=grp.items.reduce((a,x)=>a+x.l.monto,0),pag=grp.items.reduce((a,x)=>a+(COM_PAID.has(keyOf(x.l))?x.l.monto:0),0)
      const est=pag>=sub-0.001?'<span class="chip cobrado">pagada</span>':pag>0?'<span class="chip potencial">parcial</span>':'<span class="chip pendiente">pendiente</span>'
      const head=`<tr><td class="nm">${esc(grp.label)}</td><td></td><td></td><td class="nm">${fmtCur(sub,moneda)}</td><td>${est}</td>${isMgr()?`<td><button class="pg" data-togv="${k}">${pag>=sub-0.001?'desmarcar':'pagar venta'}</button></td>`:''}</tr>`
      const rows=grp.items.map(({l,i})=>{const pd=COM_PAID.has(keyOf(l))
        return `<tr><td class="sub2" style="padding-left:22px">↳ ${l.tipo==='sena'?'seña':l.tipo==='venta'?'facturación':'cuota'}</td><td class="sub2">${fmtCur(l.base,moneda)}</td><td class="sub2">${l.pct}%</td><td>${fmtCur(l.monto,moneda)}</td><td>${pd?'<span class="chip cobrado">pagada</span>':'<span class="chip pendiente">pend.</span>'}</td>${isMgr()?`<td><button class="pg" data-tog="${i}">${pd?'quitar':'pagar'}</button></td>`:''}</tr>`}).join('')
      return head+rows}).join('')}
  const manualTotal=()=>manuals.reduce((a,m)=>a+Number(m.monto_usd||0),0)
  const totals=()=>{const dev=mine.reduce((a,l)=>a+l.monto,0),pag=mine.reduce((a,l)=>a+(COM_PAID.has(keyOf(l))?l.monto:0),0)+manualTotal();return{dev,pag}}
  const manualBody=()=>manuals.length?manuals.map(m=>`<tr><td class="sub2">${fmtDate(m.pagado_at)}</td><td class="nm">${fmtCur(Number(m.monto_usd||0),moneda)}</td><td class="sub2">${esc(m.nota||'')}</td>${isMgr()?`<td><button class="pg" data-delman="${m.id}">quitar</button></td>`:''}</tr>`).join(''):`<tr><td colspan="4" class="empty">Sin pagos manuales todavía.</td></tr>`
  const draw=()=>{const t=totals();ov.querySelector('#cd_sum').textContent=`Comisión total ${fmtCur(t.dev,moneda)} · Pagado ${fmtCur(t.pag,moneda)} · Pendiente ${fmtCur(t.dev-t.pag,moneda)}`;ov.querySelector('#cd_body').innerHTML=body()||`<tr><td colspan="6" class="empty">Sin ventas con comisión todavía.</td></tr>`
    const mb=ov.querySelector('#cd_manbody');if(mb)mb.innerHTML=manualBody();wire()}
  const setPaid=async(l,val)=>{const m={origen_tipo:l.tipo,origen_id:l.id,rol:l.rol}
    if(val){const{error}=await sb.from('comision_pagos').upsert({...m,persona_id:l.personaId,lanzamiento_id:l.lanzId||null,monto_usd:l.monto,pagado_by:me.id,pagado_at:new Date().toISOString()},{onConflict:'origen_tipo,origen_id,rol'});if(error){toast('Error: '+error.message);return}COM_PAID.add(keyOf(l))}
    else{const{error}=await sb.from('comision_pagos').delete().match(m);if(error){toast('Error: '+error.message);return}COM_PAID.delete(keyOf(l))}
    changed=true}
  const addManual=async()=>{const inp=ov.querySelector('#cd_manmonto'),nota=ov.querySelector('#cd_mannota'),monto=Number(inp.value)
    if(!(monto>0)){toast('Poné un monto mayor a 0');return}
    const{data,error}=await sb.from('pagos_manuales').insert({persona_id:personaId,rol,moneda,monto_usd:monto,nota:nota.value.trim()||null,pagado_by:me.id}).select().single()
    if(error){toast('Error: '+error.message);return}
    manuals.unshift(data);inp.value='';nota.value='';changed=true;draw();toast('Pago registrado ✓')}
  const delManual=async(id)=>{if(!confirm('¿Quitar este pago?'))return
    const{error}=await sb.from('pagos_manuales').delete().eq('id',id);if(error){toast('Error: '+error.message);return}
    manuals=manuals.filter(m=>m.id!==id);changed=true;draw()}
  function wire(){
    ov.querySelectorAll('[data-tog]').forEach(b=>b.onclick=async()=>{const l=mine[Number(b.dataset.tog)];await setPaid(l,!COM_PAID.has(keyOf(l)));draw()})
    ov.querySelectorAll('[data-togv]').forEach(b=>b.onclick=async()=>{const grp=mine.filter(l=>String(l.ventaId)===b.dataset.togv),allPaid=grp.every(l=>COM_PAID.has(keyOf(l)));for(const l of grp)await setPaid(l,!allPaid);draw()})
    ov.querySelectorAll('[data-delman]').forEach(b=>b.onclick=()=>delManual(b.dataset.delman))
    const ab2=ov.querySelector('#cd_manadd');if(ab2)ab2.onclick=addManual}
  ov.innerHTML=`<div class="modal" style="max-width:720px"><h2>${esc(nombre)} · comisión ${rol} · ${moneda}</h2>
    <p class="cdesc" id="cd_sum"></p>
    ${isMgr()?'<div class="actions" style="margin:0 0 12px"><button class="btn ghost" id="cd_all">Marcar todo pagado</button></div>':''}
    <div class="tablewrap" style="margin:0"><table><thead><tr><th>Venta / origen</th><th>Base</th><th>%</th><th>Comisión</th><th>Estado</th>${isMgr()?'<th></th>':''}</tr></thead><tbody id="cd_body"></tbody></table></div>

async function renderComResumen(){const el=document.getElementById('comResumen');if(!el)return
  // Cada moneda se trackea por separado, sin conversión.
  const{data:lanzs}=await sb.from('lanzamientos').select('id,numero,nombre')
  const lmap={};(lanzs||[]).forEach(l=>lmap[l.id]=l)
  const{data:ventas}=await sb.from('ventas').select('id,lanzamiento_id,canal,setter_id,closer_id,com_setter_pct,com_closer_pct,moneda,base_comisionable,ticket,equipo').limit(10000)
  const vmap={};(ventas||[]).forEach(v=>vmap[v.id]=v)
  const{data:cuotas}=await sb.from('cuotas').select('id,monto,venta_id').eq('estado','cobrado').limit(10000)
  const{data:senas}=await sb.from('senas').select('id,monto,venta_id').eq('estado','aplicada').limit(10000)
  const{data:pagos}=await sb.from('comision_pagos').select('origen_tipo,origen_id,rol').limit(20000)
  const paid=new Set((pagos||[]).map(p=>p.origen_tipo+':'+p.origen_id+':'+p.rol))
  const bucketOf=v=>(v.canal&&v.canal!=='lanzamiento')?v.canal:(v.lanzamiento_id||'sin')
  const B={},add=(tipo,id,comBase,v)=>{const mon=v.moneda||'USD',b=bucketOf(v)+'|'+mon,o=B[b]=B[b]||{gan:0,pag:0,bucket:bucketOf(v),moneda:mon}
    ;['setter','closer'].forEach(rol=>{const pid=rol==='setter'?v.setter_id:v.closer_id;if(!pid)return;const pct=Number(rol==='setter'?v.com_setter_pct:v.com_closer_pct)||0,com=comBase*pct/100;if(com<=0.005)return;o.gan+=com;if(paid.has(tipo+':'+id+':'+rol))o.pag+=com})}
  const conCobro=new Set(),byV={}
  ;(cuotas||[]).forEach(c=>{const v=vmap[c.venta_id];if(!v)return;conCobro.add(c.venta_id);(byV[c.venta_id]=byV[c.venta_id]||[]).push({tipo:'cuota',id:c.id,monto:Number(c.monto||0)})})
  ;(senas||[]).forEach(s=>{const v=vmap[s.venta_id];if(!v||!conCobro.has(s.venta_id))return;(byV[s.venta_id]=byV[s.venta_id]||[]).push({tipo:'sena',id:s.id,monto:Number(s.monto||0)})})
  Object.keys(byV).forEach(vid=>{const v=vmap[vid],cap=(v.base_comisionable!=null&&Number(v.base_comisionable)>0)?Number(v.base_comisionable):Infinity;let cum=0
    byV[vid].forEach(ev=>{const prev=Math.min(cum,cap);cum+=ev.monto;const now=Math.min(cum,cap);add(ev.tipo,ev.id,Math.max(0,now-prev),v)})})
  // director: facturación completa (ticket) de su equipo, sin topes
  ;(ventas||[]).forEach(v=>{const dir=directorDe(v.equipo);if(!dir||!(Number(dir.com_director_pct)>0))return
    const mon=v.moneda||'USD',b=bucketOf(v)+'|'+mon,o=B[b]=B[b]||{gan:0,pag:0,bucket:bucketOf(v),moneda:mon},base=Number(v.ticket||0),com=base*Number(dir.com_director_pct)/100
    if(com<=0.005)return;o.gan+=com;if(paid.has('venta:'+v.id+':director'))o.pag+=com})
  const label=b=>b==='funnel'?'Funnel':b==='referido'?'Referidos':b==='sin'?'Sin lanzamiento':(lmap[b]?lanzLabel(lmap[b]):'Lanzamiento')
  const keys=Object.keys(B).sort((a,b)=>(B[b].gan-B[b].pag)-(B[a].gan-B[a].pag))
  el.innerHTML=`<div class="card" style="margin:0 30px 20px"><h3>A pagar por origen</h3><p class="cdesc">Comisiones por lanzamiento / funnel / referidos, separadas por moneda. Tocá una fila para filtrar abajo.</p>
    <div class="tablewrap" style="margin:0"><table><thead><tr><th>Origen</th><th>Moneda</th><th>Ganado</th><th>Pagado</th><th>Pendiente</th></tr></thead><tbody>${keys.length?keys.map(k=>{const b=B[k];return`<tr class="clk" data-src="${b.bucket==='funnel'||b.bucket==='referido'?b.bucket:(b.bucket==='sin'?'all':b.bucket)}"><td class="nm">${esc(label(b.bucket))}</td><td class="sub2">${b.moneda}</td><td>${fmtCur(b.gan,b.moneda)}</td><td>${fmtCur(b.pag,b.moneda)}</td><td class="nm" style="color:${(b.gan-b.pag)>0.005?'var(--warn)':'var(--good)'}">${fmtCur(b.gan-b.pag,b.moneda)}</td></tr>`}).join(''):'<tr><td colspan="5" class="empty">Sin comisiones todavía.</td></tr>'}</tbody></table></div></div>`
  el.querySelectorAll('tr[data-src]').forEach(tr=>tr.onclick=()=>{comLanzFilter=tr.dataset.src;renderComisiones()})}

    <li><b>Comisiones → Equipo · roles y comisiones</b>: rol + % setter / % closer de cada uno.<div class="d">Si el % está en 0, esa persona no genera comisión.</div></li>

    <li>Tocá el <b>nombre</b> de una persona → su detalle → marcá comisiones <b>pagadas</b> línea por línea, o cargá un <b>pago manual</b> (monto suelto, parcial o total) que se resta directo del pendiente.</li>
  </ol></div>

  <h2 id="g_flu">Flujos rápidos</h2>
  <div class="gcard"><h3>💵 Cargar una venta</h3><ol class="steps">
    <li><b>Ventas → + Cargar venta</b> (o desde el Reporte si cerraste la call).</li>
    <li>Lead (o nombre manual) + <b>Canal</b>.</li>
    <li>Elegí <b>Setter</b> y <b>Closer</b> (comisiones).</li>
    <li><b>Forma de pago</b>, <b>Ticket</b>, <b>Dinero que pagó</b> y las cuotas (monto + vencimiento).</li>
    <li><b>Base comisionable:</b> si cobrás recargo/interés, poné el precio base (ej: 500). Si no hay recargo, dejalo vacío.</li>
    <li>Adjuntá el <b>comprobante</b> y guardá. ✅</li>
  </ol></div>
  <div class="grid2">
    <div class="gcard" style="margin:0"><h3>🧾 Seña → venta</h3><ol class="steps">
      <li>Registrá la seña (monto + comprobante + setter/closer).</li>
      <li>Al cargar la venta, en "Seña a aplicar" elegís esa seña.</li>
      <li>Al cobrar la <b>1ª cuota</b>, la seña suma al cash collected.</li>
    </ol></div>
    <div class="gcard" style="margin:0"><h3>✅ Marcar comisión pagada</h3><ol class="steps">
      <li><b>Comisiones</b> → tocá el <b>nombre</b> de la persona.</li>
      <li>Detalle por venta: Ganado / Pagado / Pendiente.</li>
      <li>Tocá <b>"pagar"</b> cuando le transferiste esa línea puntual.</li>
    </ol></div>
  </div>
  <div class="gcard"><h3>💸 Registrar un pago parcial (sin marcar líneas)</h3>
    <p class="lead2">Para cuando le pagás un monto suelto a alguien y no querés reconciliar línea por línea (ej: le debés $400 y le transferís $150 hoy).</p>
    <ol class="steps">
      <li><b>Comisiones</b> → tocá el <b>nombre</b> de la persona.</li>
      <li>Abajo del detalle, en <b>"Pagos manuales"</b>: cargá el monto (y una nota si querés) → <b>Registrar pago</b>.</li>
      <li>El <b>Pendiente</b> de esa persona baja automáticamente ese monto. Podés cargar varios pagos hasta llegar a $0, o quitar uno si te equivocaste.</li>
    </ol></div>
  <div class="gcard"><h3>✏️ Corregir algo mal cargado</h3>
    <div class="flow"><span class="st">Ventas / Señas</span><span class="ar">→</span><span class="st">clic en la fila</span><span class="ar">→</span><span class="st">editar o eliminar</span></div>
    <p class="lead2" style="margin-top:8px">Podés cambiar montos, moneda, cuotas, reemplazar comprobante o eliminar. <b style="color:var(--ink)">Ojo:</b> editar una venta regenera sus cuotas.</p></div>

  <h2 id="g_glo">Glosario</h2>
  <div class="gcard"><table>
    <tr><th>Término</th><th>Qué significa</th></tr>
    <tr><td><b>Lead</b></td><td class="m">Persona interesada que estás trabajando.</td></tr>
    <tr><td><b>Ticket</b></td><td class="m">Precio total de la venta.</td></tr>
    <tr><td><b>Cash collected</b></td><td class="m">Plata que ya entró (cuotas cobradas + señas activadas).</td></tr>
    <tr><td><b>Facturación</b></td><td class="m">Total vendido (suma de tickets), haya entrado o no.</td></tr>
    <tr><td><b>Seña</b></td><td class="m">Reserva del cliente. No cuenta hasta la 1ª cuota.</td></tr>
    <tr><td><b>Ganado</b></td><td class="m">Comisión que la persona ya se ganó (sobre lo cobrado).</td></tr>
    <tr><td><b>Pendiente</b></td><td class="m">Comisión ganada que todavía no se pagó.</td></tr>
    <tr><td><b>Canal</b></td><td class="m">Origen de la venta: Lanzamiento, Funnel o Referido.</td></tr>
    <tr><td><b>Moneda</b></td><td class="m">USD, ARS o EUR. Cada moneda se trackea completamente por separado — nunca se convierte ni se mezcla con otra en ningún total.</td></tr>
    <tr><td><b>Base comisionable</b></td><td class="m">Tope (en la misma moneda de la venta) sobre el que se calculan las comisiones. El recargo/interés por encima de la base no comisiona.</td></tr>
    <tr><td><b>Contexto para el closer</b></td><td class="m">Situación, objetivos y dolores del lead que carga el setter al agendar — el closer lo ve en Triage.</td></tr>
    <tr><td><b>Pago manual</b></td><td class="m">Monto suelto que registrás para una persona y se resta directo de su comisión pendiente, sin marcar líneas de venta.</td></tr>
    <tr><td><b>Leve / Fluido / Potencial</b></td><td class="m">Temperatura del lead: leve = sin relación, fluido = ya hay charla real, potencial = interés directo en sumarse.</td></tr>
  </table></div>
</div>`}

if(!SUPABASE_URL||!SUPABASE_ANON_KEY){renderConfigNeeded()}
else{try{sb=createClient(SUPABASE_URL,SUPABASE_ANON_KEY)
  const{data:{session}}=await sb.auth.getSession()
  if(session)await afterLogin(session);else renderLogin()
  sb.auth.onAuthStateChange((_e,s)=>{if(!s)renderLogin()})
}catch(e){console.error('boot',e);renderError(e)}}
</script>
